# Builds the jelly binary for every platform npm installs it on. A tag `v1.2.3`
# (the version in Cargo.toml) also publishes the npm packages and a GitHub
# release; a pull request that touches the release only builds.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "npm/**"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Built on the arm64 runner; it cannot be run there, so it is not smoke-tested.
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          # An old Ubuntu, so the binary runs on older glibc too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: The binary starts
        if: ${{ !matrix.cross }}
        run: target/${{ matrix.target }}/release/jelly --version
      - name: Write the npm package
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          binary=target/${{ matrix.target }}/release/jelly
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          node npm/pack.mjs platform "$version" ${{ matrix.target }} "$binary" dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: npm-*
          merge-multiple: true
      - name: The tag is the version in Cargo.toml
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x dist/*/bin/jelly
          # The platform packages first: jellyware depends on them.
          for dir in dist/jellyware-*; do npm publish "./$dir" --access public --provenance; done
          node npm/pack.mjs main "$VERSION" dist
          npm publish ./dist/jellyware --access public --provenance
      - name: GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          for dir in dist/jellyware-*-*; do tar -czf "release/$(basename "$dir" | sed 's/^jellyware/jelly/').tar.gz" -C "$dir/bin" .; done
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes
