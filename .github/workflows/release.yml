# Once a night, what was merged to development since the last release is
# released: the jelly binary is built for every platform npm installs it on, the
# npm packages are published, and a GitHub release with the tag `v1.2.3` is
# made. A night with nothing new to ship does nothing. "Run workflow" on the
# Actions page does the same at once, for a fix that cannot wait. Nobody tags or
# bumps a version by hand. A pull request that touches the release only builds.
name: release

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, on development
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml", "npm/**"]

# One release at a time, so a night's run and a pressed button do not pick the
# same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The next version: one patch above the latest release tag. Tags, not npm:
  # npm can say the old version for minutes after a publish, and the next
  # release would pick the same number. For a new minor or major, set it in
  # Cargo.toml; it is used as long as it is ahead of the latest tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      ships: ${{ steps.next.outputs.ships }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the latest release's commit, to compare with
      - id: next
        run: |
          latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##' | sort -V | tail -1)
          # What goes into the binary and the npm packages. The relay, the site
          # and the docs are not released from here.
          if git diff --quiet "v$latest" HEAD -- src assets skill npm build.rs Cargo.toml Cargo.lock; then
            echo "nothing that ships has changed since v$latest"
            echo "ships=false" >> "$GITHUB_OUTPUT"
          else
            echo "ships=true" >> "$GITHUB_OUTPUT"
          fi
          patch=$(echo "$latest" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')
          ours=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          version=$(printf '%s\n%s\n' "$patch" "$ours" | sort -V | tail -1)
          echo "the latest release is $latest, Cargo.toml says $ours: releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    # A pull request always builds, to prove the release still works.
    if: github.event_name == 'pull_request' || needs.version.outputs.ships == 'true'
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The version the binary reports (build.rs); the release tag is made after.
      JELLY_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Built on the arm64 runner; it cannot be run there, so it is not smoke-tested.
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          # An old Ubuntu, so the binary runs on older glibc too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: The binary starts and says the release version
        if: ${{ !matrix.cross }}
        run: |
          said=$(target/${{ matrix.target }}/release/jelly --version)
          [ "$said" = "jelly $VERSION" ] || { echo "the binary says '$said', not 'jelly $VERSION'"; exit 1; }
      - name: Write the npm package
        run: |
          binary=target/${{ matrix.target }}/release/jelly
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          node npm/pack.mjs platform "$VERSION" ${{ matrix.target }} "$binary" dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: dist

  publish:
    if: github.event_name != 'pull_request' && needs.version.outputs.ships == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: npm-*
          merge-multiple: true
      # No token: npm signs in through GitHub (Trusted Publishing). Each package
      # names this repo and this workflow file in its settings on npmjs.com.
      - name: Publish to npm
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x dist/*/bin/jelly
          # The platform packages first: jellyware depends on them.
          # A package already out at this version is left alone, so a release
          # that stopped halfway can be run again.
          node npm/pack.mjs main "$VERSION" dist
          for dir in dist/jelly-*-* dist/jellyware; do
            name=$(node -p "require('./$dir/package.json').name")
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then echo "$name@$VERSION is already published"; continue; fi
            npm publish "./$dir" --access public --provenance
          done
      - name: GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          for dir in dist/jelly-*-*; do tar -czf "release/$(basename "$dir").tar.gz" -C "$dir/bin" .; done
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --generate-notes
