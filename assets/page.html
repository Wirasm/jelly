<!doctype html>
<html class="jy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jelly</title>
<meta name="jelly-comment" content="off">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cpath%20d%3D%22M8%2030%20C4%2022%206%2010%2020%209%20C34%2010%2036%2022%2032%2030%20C29%2035%2011%2035%208%2030Z%22%20fill%3D%22%23ff4f8b%22/%3E%3Cellipse%20cx%3D%2215%22%20cy%3D%2216%22%20rx%3D%224%22%20ry%3D%222.4%22%20fill%3D%22%23fff%22%20opacity%3D%22.7%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2224%22%20r%3D%221.9%22%20fill%3D%22%233b0a1e%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%221.9%22%20fill%3D%22%233b0a1e%22/%3E%3C/svg%3E">
<style>
  /* Berry by day, Night jelly by night: the blob logo's own colours. */
  :root {
    --page: var(--jy-page); --card: var(--jy-card); --ink: var(--jy-ink); --muted: var(--jy-muted); --line: var(--jy-line); --line-2: var(--jy-line-2);
    --bar: var(--jy-bar); --bar-ink: var(--jy-ink); --bar-muted: var(--jy-muted); --bar-line: var(--jy-bar-line); --chip-on: var(--jy-on); --chip-on-ink: var(--jy-on-ink);
    --brand: var(--jy-brand); --brand-soft: var(--jy-brand-soft); --brand-soft-ink: var(--jy-brand-soft-ink); --brand-glow: var(--jy-glow);
    --sun: var(--jy-sun); --sun-ink: var(--jy-sun-ink); --sun-soft: var(--jy-sun-soft);
    --accent: var(--brand); --accent-ink: var(--brand-soft-ink);
    --shadow: var(--jy-shadow);
    color-scheme: light;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  .app { display: grid; grid-template-rows: 44px 1fr; grid-template-columns: 220px minmax(0, 1fr); height: 100%; }

  /* top bar */
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
  .dot.live { background: var(--accent); box-shadow: 0 0 0 3px var(--brand-glow); }
  .find { position: relative; flex: 1; max-width: 420px; margin-left: 14px; }
  .find input { width: 100%; padding: 5px 30px 5px 10px; border-radius: 8px; border: 1px solid var(--bar-line); background: var(--card); outline: none; }
  .find input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--brand-glow); }
  .find kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
  .top .me { border: 1px solid var(--bar-line); background: none; color: var(--bar-muted); border-radius: 7px; padding: 3px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .top .me:hover { color: var(--bar-ink); background: var(--brand-soft); }
  .top .sp { flex: 1; }
  .top .keys { color: var(--bar-muted); font-size: 11px; display: flex; gap: 10px; white-space: nowrap; }
  kbd { font: 10.5px ui-monospace, monospace; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; color: var(--muted); }

  /* projects, down the side */
  .rail { overflow-y: auto; min-height: 0; padding: 18px 10px 24px 14px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
  .rail h2 { margin: 0 8px 8px; }
  .rail a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; min-width: 0; }
  .rail a:hover { background: var(--card); }
  .rail a.on { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 600; }
  .rail a .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail a .ct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 400; }
  .rail a.on .ct { color: inherit; }
  .rail .padd { text-align: left; color: var(--muted); border: 1px dashed var(--line-2); background: none; border-radius: 8px; padding: 5px 8px; margin-top: 8px; cursor: pointer; }
  .rail .padd:hover { color: var(--ink); border-color: var(--ink); }
  .pin { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--accent); background: var(--card); outline: none; box-shadow: 0 0 0 3px var(--brand-glow); }
  .rail .pin { width: 100%; margin-top: 8px; }
  .rail .hint { color: var(--muted); font-size: 11.5px; padding: 4px 8px; }

  /* the list */
  .listwrap { position: relative; min-height: 0; display: grid; }
  .list { overflow-y: auto; min-height: 0; padding: 22px 28px 30vh; }
  .list > * { max-width: 1120px; margin-left: auto; margin-right: auto; }
  .list section { margin-bottom: 34px; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 4px 8px; display: flex; gap: 8px; align-items: center; font-weight: 600; }
  h2 .n { letter-spacing: 0; text-transform: none; font-weight: 400; }
  h2 .sp { flex: 1; }
  h2.proj { font-size: 16px; letter-spacing: -.01em; text-transform: none; color: var(--ink); font-weight: 700; margin-bottom: 10px; }
  h2.proj a { color: inherit; text-decoration: none; }
  h2.proj a:hover { color: var(--accent-ink); }
  h2.proj .n { font-size: 12px; color: var(--muted); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
  .box.hot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--brand-glow); }
  .sub { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 10px 4px; font-weight: 600; }
  .sub:first-child { margin-top: 6px; }
  .cols { columns: 2; column-gap: 14px; }
  .cols .row { break-inside: avoid; }
  .none { color: var(--muted); padding: 8px 10px; }
  .none code, .empty code { font: 11.5px ui-monospace, monospace; background: var(--line); padding: 1px 6px; border-radius: 4px; color: var(--ink); }
  .empty { max-width: 460px; margin: 18vh auto 0; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 8px; }

  /* one jelly, one line */
  .row { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; border-radius: 9px; cursor: pointer; min-height: 38px; }
  .row:hover, .row:focus-within { background: var(--page); }
  .row .fresh { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .row .fresh.new { background: var(--brand); }
  .row .fresh.updated { box-shadow: inset 0 0 0 2px var(--brand); }
  .row .open { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: baseline; text-align: left; border: 0; background: none; padding: 9px 0; cursor: pointer; font-size: 13.5px; }
  .row .open:focus-visible { outline: none; }
  .row:has(.open:focus-visible) { box-shadow: inset 0 0 0 2px var(--accent); }
  .row .open b { flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .row .open span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row.arch .open b { font-weight: 500; color: var(--muted); }
  .row .when { flex: none; color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 52px; text-align: right; }
  .row .chip { flex: none; color: var(--muted); font-size: 12px; text-decoration: none; white-space: nowrap; border-radius: 6px; padding: 1px 6px; }
  .row .chip:hover { background: var(--brand-soft); color: var(--brand-soft-ink); }
  .tag { flex: none; font: 600 10.5px -apple-system, sans-serif; border-radius: 999px; padding: 1px 8px; background: var(--sun); color: var(--sun-ink); white-space: nowrap; }
  .tag.soft, .tag.work { background: var(--brand-soft); color: var(--brand-soft-ink); }
  .tag.share { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--jy-good); }
  .tag.soon { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--jy-warn); }
  .who { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .who code { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
  .btn { font-size: 12.5px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--line-2); }
  .btn.on { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { background: var(--card); border-color: var(--line); color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.waiting { background: var(--brand-soft); border-color: var(--brand-soft); color: var(--brand-soft-ink); }
  h2 .btn { font-weight: 400; letter-spacing: 0; text-transform: none; }
  /* Copy reference and the ··· menu: there on hover, on focus and on a phone. */
  .cp, .dots { flex: none; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 11px; }
  .dots { font: 700 14px/1 -apple-system, sans-serif; letter-spacing: 1px; padding: 3px 7px 7px; }
  .row .cp, .row .dots { opacity: 0; }
  .row:hover .cp, .row:hover .dots, .row:focus-within .cp, .row:focus-within .dots, .cp.ok, .dots.on { opacity: 1; }
  @media (hover: none) { .row .cp, .row .dots { opacity: 1; } }
  .cp:hover, .cp.ok, .dots:hover, .dots.on { color: var(--ink); background: var(--brand-soft); }
  .cp:focus-visible, .dots:focus-visible { outline: 2px solid var(--accent); }

  /* what is shared */
  .share { border-radius: 9px; padding: 2px 6px 2px 10px; }
  .share + .share { border-top: 1px solid var(--line); border-radius: 0; }
  .sh-top { display: flex; align-items: center; gap: 10px; min-height: 38px; }
  .sh-top .open { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: baseline; text-align: left; border: 0; background: none; padding: 9px 0; cursor: pointer; font-size: 13.5px; }
  .sh-top .open b { flex: none; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sh-top .open span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sh-top .left { flex: none; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .sh-top .left.low { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--jy-warn); text-underline-offset: 3px; }
  .sh-p { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 0 4px 14px; }
  .sh-p .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex-wrap: nowrap; }
  .sh-p .ap-done { margin-right: auto; white-space: nowrap; }

  /* the ··· menu, the hover preview, the undo */
  #menu { position: fixed; z-index: 30; min-width: 200px; max-height: 70vh; overflow-y: auto; padding: 5px; border-radius: 11px; background: var(--card); border: 1px solid var(--line-2); box-shadow: 0 18px 40px -18px var(--shadow); }
  #menu[hidden], #peek[hidden], #toast[hidden] { display: none; }
  #menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: var(--page); outline: none; }
  #menu .mh { font: 11px ui-monospace, monospace; color: var(--muted); padding: 5px 10px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  #menu .ms { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
  #menu .bad { box-shadow: inset 2px 0 0 var(--jy-bad); border-radius: 0 7px 7px 0; }
  #peek { position: fixed; z-index: 20; width: 404px; padding: 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line-2); box-shadow: 0 24px 60px -18px var(--shadow); pointer-events: none; }
  #peek .shot { width: 384px; height: 240px; border-radius: 8px; overflow: hidden; background: var(--page); }
  #peek iframe { width: 1280px; height: 800px; border: 0; transform: scale(.3); transform-origin: 0 0; }
  #peek img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  #peek .cap { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font: 11px ui-monospace, monospace; color: var(--muted); }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 40; display: flex; gap: 14px; align-items: center; background: var(--ink); color: var(--page); border-radius: 12px; padding: 9px 10px 11px 16px; box-shadow: 0 18px 44px -16px var(--shadow); overflow: hidden; max-width: calc(100vw - 32px); }
  #toast button { font-weight: 600; border: 0; border-radius: 8px; padding: 4px 12px; background: var(--page); color: var(--ink); cursor: pointer; }
  #toast i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--brand); transform-origin: left; animation: drain 10s linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }

  /* Ask about the whole jelly: its threads and a field for a new question. */
  .askpop { position: fixed; z-index: 25; display: grid; gap: 8px; overflow-y: auto; background: var(--card); color: var(--ink); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 18px 40px -18px var(--shadow); padding: 10px; }
  .ap-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ap-list { display: grid; gap: 8px; }
  .ap-list:empty { display: none; }
  .ap-t { display: grid; gap: 4px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
  .ap-m { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ap-m b { font-weight: 600; margin-right: 4px; }
  .ap-m.agent b { color: var(--accent-ink); }
  .ap-done { color: var(--muted); font-size: 12px; }
  .ap-reply { display: flex; gap: 6px; }
  .askpop textarea, .ap-reply input { color: var(--ink); background: var(--page); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .ap-reply input { flex: 1; }
  .askpop textarea { resize: vertical; min-height: 64px; }
  .askpop textarea:focus, .ap-reply input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .ap-row { display: flex; align-items: center; gap: 8px; }
  .ap-row span { flex: 1; color: var(--muted); font-size: 12px; }

  /* full size */
  .full { position: fixed; inset: 44px 0 0 0; z-index: 10; display: flex; flex-direction: column; background: var(--page); animation: open .18s ease-out; }
  @keyframes open { from { opacity: 0; transform: scale(.985); } }
  .full[hidden] { display: none; }
  .fbar { display: flex; flex-shrink: 0; align-items: center; gap: 12px; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); min-height: 54px; }
  .fbar .title { flex: 1; min-width: 0; }
  .fbar h1 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fbar .who { overflow-wrap: anywhere; }
  .fbar .who b { color: var(--ink); font-weight: 600; }
  .factions { display: flex; align-items: center; gap: 12px; flex: none; }
  .full iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: var(--card); }
  /* A shaped jelly's next version draws here, unseen, at the old frame's size. */
  iframe.next { position: fixed !important; left: 0 !important; top: 0 !important; width: var(--w) !important; height: var(--h) !important; opacity: 0; pointer-events: none; }

  /* the blob */
  .logo { flex: none; transform-origin: 50% 90%; }
  .logo.jig { animation: jig .7s cubic-bezier(.3,1.6,.5,1); }
  .logo.happy { animation: hop 1s cubic-bezier(.3,1.6,.5,1); }
  .logo .eyes { transform-origin: 20px 24px; animation: blink 6s infinite; }
  @keyframes jig { 0% { transform: none; } 25% { transform: scale(1.18,.82); } 50% { transform: scale(.9,1.12); } 75% { transform: scale(1.05,.95); } }
  @keyframes hop { 0% { transform: none; } 30% { transform: translateY(-8px) scale(.9,1.12); } 60% { transform: translateY(0) scale(1.15,.85); } }
  @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
  .word { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
  /* a newer jelly: a quiet card in the corner of the list */
  .update { position: absolute; left: 16px; bottom: 16px; z-index: 5; max-width: min(420px, calc(100% - 32px)); padding: 10px 12px; display: grid; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .update[hidden] { display: none; }
  .update b { color: var(--ink); font-weight: 600; }
  .update code { display: block; margin-top: 4px; font: 11px ui-monospace, Menlo, monospace; color: var(--ink); overflow-wrap: anywhere; }
  .update .row { display: flex; gap: 8px; align-items: center; padding: 0; min-height: 0; cursor: default; }
  .update .row:hover { background: none; }

  @media (max-width: 900px) {
    /* No room beside the list: the projects become a strip above it. */
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 44px auto 1fr; }
    .rail { flex-direction: row; align-items: center; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
    .rail h2, .rail a .ct { display: none; }
    .rail a, .rail .padd, .rail .pin { flex: none; margin-top: 0; }
    .rail .pin { width: 180px; }
    .top { gap: 6px; padding: 0 10px; }
    .top .keys, .top .sp, .word { display: none; }
    .find { margin-left: 0; }
    .top .me { flex: none; }
    .list { padding: 16px 12px 30vh; }
    .cols { columns: 1; }
    .row .open span, .row .when, .sh-top .open span { display: none; }
    .row .open b { flex: 1; max-width: none; }
    h2 { flex-wrap: wrap; }
    .find { min-width: 90px; }
    .fbar { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 8px 12px; }
    .factions { grid-column: 1 / -1; flex-wrap: wrap; gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .logo, .logo .eyes, #toast i, .full { animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <svg class="logo" id="logo" width="28" height="28" viewBox="0 0 40 40" aria-label="jelly"><defs><radialGradient id="lg" cx="35%" cy="30%"><stop offset="0" stop-color="#ffb3cf"/><stop offset=".55" stop-color="#ff4f8b"/><stop offset="1" stop-color="#d81b60"/></radialGradient></defs><path d="M8 30 C4 22 6 10 20 9 C34 10 36 22 32 30 C29 35 11 35 8 30Z" fill="url(#lg)"/><ellipse cx="15" cy="16" rx="4" ry="2.4" fill="#fff" opacity=".7"/><g class="eyes"><circle cx="16" cy="24" r="1.7" fill="#3b0a1e"/><circle cx="24" cy="24" r="1.7" fill="#3b0a1e"/></g><path class="mouth" d="M18 27.5 Q20 29.3 22 27.5" stroke="#3b0a1e" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg><b class="word">jelly</b><span class="dot" id="live" title="Connected"></span>
    <label class="find"><input id="q" placeholder="Find a jelly by name or what it is for" autocomplete="off" aria-label="Find a jelly"><kbd>/</kbd></label>
    <span class="sp"></span>
    <button class="me" id="notify" hidden title="Show a notification when an agent asks you something and this tab is not in front">Notify me</button>
    <button class="me" id="me" title="Your name on what you do here, so others can tell who did what"></button>
    <span class="keys"><span><kbd>n</kbd> next for you</span><span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>↵</kbd> open</span></span>
  </div>
  <nav class="rail" id="rail" aria-label="Projects"></nav>
  <div class="listwrap">
    <main class="list" id="list"></main>
    <div class="update jy-card" id="update" role="status" hidden></div>
  </div>
</div>
<section class="full" id="full" hidden>
  <div class="fbar">
    <button class="btn" id="back" title="Back to the list (Esc)">← Back</button>
    <div class="title"><h1 id="ftitle"></h1><div class="who" id="fmeta"></div></div>
    <div class="factions">
      <button class="btn quiet" id="fnext" hidden title="The next jelly that waits on you (n)"></button>
      <span id="fask"></span>
      <button class="btn" id="fcomment" title="Pin a comment to any part (c)">Comment</button>
      <button class="btn quiet" id="fundo">Undo</button>
      <button class="btn quiet" id="fkeep"></button>
      <button class="btn quiet" id="frm">Remove</button>
    </div>
  </div>
</section>
<div id="menu" role="menu" aria-label="More for this jelly" hidden></div>
<div id="peek" aria-hidden="true" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
  // The jelly page: every jelly as one line, under its project. What waits on
  // the person is first, then what is shared and what is about to be archived.
  // A jelly opens full size, where the person comments, answers and asks.
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const enc = encodeURIComponent;
  const slug = (n) => n.replace(/[^a-z0-9_-]/g, "-");
  const DAY = 86400000;
  let jellies = [];    // every jelly but the page itself, archived ones too
  let projects = [];   // [{name, jellies}], empty projects too
  let openAsks = [];   // open asks across this page's jellies
  let shares = [];     // what is shared, from the daemon's record or the relay
  const byName = (n) => jellies.find((j) => j.name === n);
  let full = null, booted = false;
  // What the person is in the middle of on this page; none of it is state anyone else needs.
  const ui = { q: "", archived: new Set(), edit: null, share: null };
  // /p/<project> is this same page showing one project's jellies; / shows all.
  const PROJECT = location.pathname.startsWith("/p/") ? decodeURIComponent(location.pathname.slice(3)) : null;
  if (PROJECT) document.title = `${PROJECT} · jelly`;

  function ago(ms) {
    const s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }
  // How long until `ms`: "3d", "5h 10m", "12m".
  function left(ms) {
    const m = Math.max(0, Math.round((ms - Date.now()) / 60000));
    return m >= 1440 ? `${Math.floor(m / 1440)}d` : m >= 60 ? `${Math.floor(m / 60)}h${m < 600 && m % 60 ? ` ${m % 60}m` : ""}` : `${m}m`;
  }
  const tail = (n) => n.slice(n.indexOf(":") + 1);
  const who = (by) => (by ? jelly.who(by) : "?");
  const plural = (n, word, many = word + "s") => `${n} ${n === 1 ? word : many}`;
  const waits = (j) => (j.open_asks || 0) + (j.replies_waiting || 0);
  // The daemon says when a jelly will be archived; the last two days of that get a mark.
  const soon = (j) => j.archives_ms && j.archives_ms - Date.now() < 2 * DAY;
  const shared = (n) => shares.some((s) => s.jelly === n);
  const byChange = (a, b) => b.updated_ms - a.updated_ms;
  const inScope = (j) => !PROJECT || j.project === PROJECT;
  const matches = (j) => ui.q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => `${j.name} ${j.about || ""}`.toLowerCase().includes(w));
  // The order `n` walks: what waits on the person, the one that changed last first.
  const waiting = () => jellies.filter((j) => inScope(j) && waits(j) && !removing.has(j.name)).sort(byChange);

  // What the person has looked at, per jelly version, kept in the page's own state.
  const seenVersion = (n) => jelly.state.seen?.[n] || 0;
  function freshness(j) {
    if (j.archived) return "";
    const v = seenVersion(j.name);
    if (!v) return "new";
    return j.version > v && !jelly.isPerson(j.made_by) ? "updated" : "";
  }
  function markSeen(name) {
    const j = byName(name);
    if (j && seenVersion(name) < j.version && !document.hidden) jelly.do("seen", { name, version: j.version }).catch(() => {});
  }
  function tags(j, wide) {
    const out = [];
    if (j.working) out.push(`<span class="tag work">${esc(who(j.working.by))} is working</span>`);
    if (j.open_asks) out.push(`<span class="tag">${j.open_asks} for you</span>`);
    if (j.replies_waiting) out.push(`<span class="tag soft">${plural(j.replies_waiting, "reply", "replies")} for you</span>`);
    else if (wide && j.open_comments) out.push(`<span>${plural(j.open_comments, "open comment")}</span>`);
    if (shared(j.name)) out.push(`<span class="tag share">shared</span>`);
    if (soon(j)) out.push(`<span class="tag soon" title="Nobody keeps it and it has been quiet. Keep it to stop this.">archives in ${left(j.archives_ms)}</span>`);
    return out.join("");
  }

  // ---- the list ---------------------------------------------------------------

  // One jelly on one line. `sec` keeps ids apart where a jelly shows in two
  // sections; `chip` names its project where the section mixes projects.
  function row(j, sec, chip) {
    const f = freshness(j);
    return `<div class="row${j.archived ? " arch" : ""}" data-name="${esc(j.name)}" id="${sec}-${slug(j.name)}">
      <i class="fresh ${f}"${f ? ` title="${f === "new" ? "New to you" : "Changed since you looked"}"` : ""}></i>
      <button class="open" title="${esc(j.name)}"><b>${esc(tail(j.name))}</b><span>${esc(j.about || "")}</span></button>
      ${COPY}${tags(j)}${chip && j.project ? `<a class="chip" href="/p/${enc(j.project)}">${esc(j.project)}</a>` : ""}<span class="when">${ago(j.updated_ms)}</span>
      <button class="dots" data-act="menu" aria-haspopup="menu" aria-label="More for ${esc(tail(j.name))}">···</button></div>`;
  }
  const rows = (list, sec, chip) => `<div class="${list.length > 8 ? "cols" : ""}">${list.map((j) => row(j, sec, chip)).join("")}</div>`;

  // A project: what is kept, what is not, and what was archived, behind a button.
  function projectSection(p, list) {
    const kept = list.filter((j) => j.kept && !j.archived), rest = list.filter((j) => !j.kept && !j.archived), arch = list.filter((j) => j.archived);
    const total = jellies.filter((j) => j.project === p).length;
    const counts = total ? [kept.length && `${kept.length} kept`, rest.length && `${rest.length} not kept`, arch.length && `${arch.length} archived`].filter(Boolean).join(" · ") : "empty";
    const showArch = ui.archived.has(p) || !!ui.q;
    return `<section id="s-${slug(p || "none")}"><h2 class="proj">${p ? `<a href="/p/${enc(p)}">${esc(p)}</a>` : "No project"}
      <span class="n">${counts}</span><span class="sp"></span>${p && !total ? `<button class="btn quiet" data-rmproject="${esc(p)}">Remove</button>` : ""}</h2>
      <div class="box">${total ? "" : `<div class="none">No jellies yet. Agents working in a repo named ${esc(p)} put theirs here; move one in from its ··· menu.</div>`}
        ${kept.length ? `<div class="sub">Kept</div>${rows(kept, "k")}` : ""}
        ${rest.length ? `<div class="sub">Not kept</div>${rows(rest, "k")}` : ""}
        ${arch.length ? (showArch ? `<div class="sub">Archived</div>${rows(arch, "k")}` : `<button class="btn quiet" data-arch="${esc(p)}">Show ${arch.length} archived</button>`) : ""}
      </div></section>`;
  }

  const until = (ms) => `${left(ms)} left`;
  function shareSection(list) {
    return `<section><h2>Shared now <span class="n">${list.length}</span></h2><div class="box" id="shared">${list.map((s) => {
      const i = shares.indexOf(s), here = s.people.reduce((n, p) => n + (p.here || 0), 0), named = s.people.filter((p) => p.who).length, anyone = s.people.some((p) => !p.who);
      const how = [named && plural(named, "person", "people"), anyone && "a view-only link", !s.people.length && "a PIN only", here && `${here} here now`].filter(Boolean).join(" · ");
      return `<div class="share"><div class="sh-top"><button class="open" data-share-open="${i}" title="Open ${esc(s.jelly)}"><b>${esc(PROJECT ? tail(s.jelly) : s.jelly)}</b><span>${esc(how)}</span></button>
        ${s.expires_at ? `<span class="left${s.expires_at - Date.now() < DAY / 8 ? " low" : ""}" title="Until ${esc(new Date(s.expires_at).toLocaleString())}">${until(s.expires_at)}</span>` : ""}
        <button class="btn quiet" data-share-who="${i}" aria-expanded="${ui.share === s.jelly}">${ui.share === s.jelly ? "Hide" : "Who"}</button><button class="btn" data-stop="${i}">Stop sharing</button></div>
        ${ui.share !== s.jelly ? "" : (s.people.map((p, k) => `<div class="sh-p"><span class="dot${p.here ? " live" : ""}"></span>
          <span class="who">${p.who ? esc(p.who) : "Anyone with the view-only link"}</span>
          <span class="ap-done">${p.here ? "here now" : p.opened_ms ? `opened ${ago(p.opened_ms)}` : s.people_from === "relay" ? "not opened yet" : ""}${p.who && !p.can_act ? " · view only" : ""}</span>
          ${s.links[p.who] ? `<button class="cp" data-copylink="${i}:${k}">Copy link</button>` : ""}
          <button class="cp" data-revoke="${i}:${k}">Stop</button></div>`).join("") || `<div class="sh-p ap-done">No links yet: only a PIN.</div>`)
          + (s.people_from === "relay" ? "" : `<div class="sh-p ap-done">The relay did not answer, so who opened it is unknown.</div>`)}
      </div>`;
    }).join("")}</div></section>`;
  }

  let drawn = { rail: "", list: "" }, redrawing = false;
  function render() {
    const scope = jellies.filter((j) => inScope(j) && !removing.has(j.name));
    const found = scope.filter(matches), live = found.filter((j) => !j.archived);
    // Projects, the one touched last first; empty ones after those, by name.
    const last = (p) => Math.max(0, ...jellies.filter((j) => j.project === p).map((j) => j.updated_ms));
    const names = [...new Set([...projects.map((p) => p.name), ...jellies.map((j) => j.project).filter(Boolean), ...(PROJECT ? [PROJECT] : [])])].sort((a, b) => last(b) - last(a) || a.localeCompare(b));
    const link = (href, label, list, on) => { const w = list.filter(waits).length; return `<a href="${href}" class="${on ? "on" : ""}"><span class="pn">${esc(label)}</span>${w ? `<span class="tag" title="${w} wait on you">${w}</span>` : ""}<span class="ct">${list.filter((j) => !j.archived).length}</span></a>`; };
    const rail = `<h2>Projects</h2>${link("/", "All", jellies, !PROJECT)}${names.map((p) => link(`/p/${enc(p)}`, p, jellies.filter((j) => j.project === p), p === PROJECT)).join("")}`
      + (ui.edit ? `<input class="pin" id="newproject" value="${esc(ui.edit.value)}" placeholder="Name, then Enter" aria-label="Name of the new project" autocomplete="off"><div class="hint">a-z, 0-9, - and _</div>` : `<button class="padd" id="addproject">+ New project</button>`);

    let html = "";
    const w = found.filter(waits).sort(byChange);
    if (w.length) html += `<section><h2>Waiting on you <span class="n">${w.length}</span><span class="sp"></span><span class="n"><kbd>n</kbd> next</span></h2><div class="box hot" id="waiting">${rows(w, "w", !PROJECT)}</div></section>`;
    const sh = shares.filter((s) => found.some((j) => j.name === s.jelly));
    if (sh.length) html += shareSection(sh);
    const going = live.filter(soon).sort((a, b) => a.archives_ms - b.archives_ms);
    if (going.length) html += `<section><h2>Disappearing soon <span class="n">${going.length} · archived after a quiet week unless you keep them</span></h2><div class="box" id="going">${rows(going, "g", !PROJECT)}</div></section>`;
    if (!PROJECT && !ui.q && live.length) html += `<section><h2>Recent <span class="n">by last change</span></h2><div class="box" id="recent">${rows([...live].sort(byChange).slice(0, 8), "r", true)}</div></section>`;
    for (const p of PROJECT ? [PROJECT] : [...names, ""]) {
      const list = found.filter((j) => j.project === p).sort(byChange);
      // While finding, a project with no match says nothing; an empty project shows so it can be filled or removed.
      if (list.length || (p && !ui.q)) html += projectSection(p, list);
    }
    if (!html) html = ui.q ? `<div class="empty"><b>Nothing matches “${esc(ui.q)}”</b>It looks in names and in what each jelly is for.</div>`
      : `<div class="empty"><b>No jellies yet</b>Agents put things here as they work. Ask one to show you something, or run <code>jelly ask</code>.</div>`;

    // Rows are plain markup, so a redraw is cheap; skipping an unchanged one keeps focus and the hover preview still.
    for (const [key, next] of [["rail", rail], ["list", html]]) {
      if (drawn[key] === next) continue;
      // What had focus has it again afterwards, a field with its caret where it was. Nothing else is given focus.
      const active = document.activeElement, id = $(key).contains(active) ? active.id || active.closest("[id]")?.id : null, wasOpen = active?.classList?.contains("open");
      const caret = active?.classList?.contains("pin") ? [active.selectionStart, active.selectionEnd] : null;
      drawn[key] = next;
      redrawing = true;
      $(key).innerHTML = next;
      const again = id && $(id);
      if (again) (wasOpen ? again.querySelector(".open") || again : again).focus();
      if (again && caret) again.setSelectionRange(...caret);
      redrawing = false;
    }
    if (menuFor && !byName(menuFor)) closeMenu();
    $("fnext").hidden = !full || !waiting().some((j) => j.name !== full);
    $("fnext").textContent = `Next for you · ${waiting().filter((j) => j.name !== full).length}`;
  }

  // ---- full size ----------------------------------------------------------------

  // Older local focus echoes must not replace a more recent frame.
  let focusWrites = Promise.resolve(), pendingFocusWrites = 0;
  function writeFocus(name) {
    pendingFocusWrites++;
    focusWrites = focusWrites.then(() => jelly.do("show", { name })).catch((err) => alert("Could not save your view selection. Try the action again.\n" + err.message)).finally(() => {
      pendingFocusWrites--;
      if (!pendingFocusWrites) applyFocus(jelly.state);
    });
  }
  let pendingAttend = null, returnTo = null;
  function openFull(name, fromAgent) {
    if (!byName(name)) return;
    closeAsk(); closeMenu(); hidePeek();
    if (!full) returnTo = document.activeElement?.closest?.(".row")?.id || null;
    if (full !== name) {
      pendingAttend = null;
      full = name;
      for (const f of $("full").querySelectorAll("iframe")) f.remove();
      const f = document.createElement("iframe");
      f.src = `/j/${enc(name)}/`;
      f.title = name;
      f.dataset.jellySwap = "";
      $("full").appendChild(f);
    }
    $("full").hidden = false;
    renderFull();
    setCommenting(false);
    if (!fromAgent) writeFocus(name);
    setTimeout(() => markSeen(name), 800);
  }
  function renderFull() {
    const j = byName(full);
    if (!j || removing.has(full)) return closeFull();
    $("ftitle").textContent = j.about || j.name;
    $("fask").innerHTML = askButton(j);
    $("fmeta").innerHTML = `<code>${esc(j.name)}</code>${COPY}<span>by ${esc(who(j.made_by))}</span><span>v${j.version}</span><span>${ago(j.updated_ms)}</span>${tags(j, true)}`;
    $("fkeep").textContent = j.archived ? "Restore" : j.kept ? "Stop keeping" : "Keep";
  }
  function closeFull(fromAgent) {
    pendingAttend = null;
    if (!full) return;
    closeAsk();
    full = null;
    $("full").hidden = true;
    for (const f of $("full").querySelectorAll("iframe")) f.remove();
    if (!fromAgent) writeFocus(null);
    render();
    (returnTo && $(returnTo))?.querySelector(".open")?.focus();
  }
  // Opens the jelly at one of its asks: the view scrolls to it once it has loaded.
  function attend(name, itemId) {
    const iframe = $("full").querySelector("iframe");
    if (!itemId || !iframe) return;
    const request = { iframe, itemId };
    pendingAttend = request;
    const send = () => {
      if (pendingAttend !== request || iframe !== $("full").querySelector("iframe")) { iframe.removeEventListener("load", send); return; }
      if (iframe.contentDocument?.readyState !== "complete" || iframe.contentWindow.jelly?.name !== name) return;
      pendingAttend = null;
      iframe.removeEventListener("load", send);
      iframe.contentWindow.postMessage({ type: "jelly:ask", id: itemId }, location.origin);
    };
    iframe.addEventListener("load", send);
    send();
  }
  function nextWaiting() {
    const list = waiting();
    if (!list.length) return;
    const j = list[(list.findIndex((x) => x.name === full) + 1) % list.length];
    openFull(j.name);
    attend(j.name, openAsks.find((a) => a.jelly === j.name)?.id);
  }

  // ---- comments -------------------------------------------------------------

  function setCommenting(on) {
    $("fcomment").classList.toggle("on", on);
    $("fcomment").textContent = on ? "Click a part · Esc" : "Comment";
  }
  const frame = () => $("full").querySelector("iframe:not(.next)");
  // A message counts only from the frame of the jelly it names, while it is open
  // (a reload swaps in a second frame for a moment).
  const sentBy = (e, name) => full === name && [...$("full").querySelectorAll("iframe")].some((f) => f.contentWindow === e.source);
  function toggleComment() {
    const f = frame();
    if (!f) return;
    const on = !$("fcomment").classList.contains("on");
    setCommenting(on);
    f.contentWindow.postMessage({ type: "jelly:comment", on }, location.origin);
    f.focus();
  }
  addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const d = e.data;
    if (d?.type === "jelly:commenting" && sentBy(e, d.name)) setCommenting(d.on);
    if (d?.type === "jelly:show" && byName(d.name)) openFull(d.name);
    // Keys typed in a jelly that it did not use: the page's shortcuts, as if typed here.
    if (d?.type === "jelly:key" && sentBy(e, d.name)) shortcut(String(d.key));
    if (d?.type === "jelly:reload") {
      const f = [...document.querySelectorAll("iframe[data-jelly-swap]")].find((f) => f.contentWindow === e.source);
      if (f) swap(f.swapFor || f);
    }
  });

  // ---- copy reference ---------------------------------------------------------

  // Two lines the person pastes into a chat so their agent knows which jelly
  // they mean and where it stands.
  const COPY = `<button class="cp" data-act="copy" title="Copy a reference to this jelly, to paste to your agent" aria-label="Copy reference"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="2"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg></button>`;
  function reference(j) {
    const maker = jelly.isPerson(j.made_by) ? j.made_by.slice(7) || "the person" : j.made_by;
    const asks = [j.open_asks && plural(j.open_asks, "open question"), j.answered && `${j.answered} answered`].filter(Boolean).join(", ");
    const state = [`made by ${maker} ${ago(j.created_ms)}`, `updated ${ago(j.updated_ms)}`, `v${j.version}`, asks, j.open_comments && plural(j.open_comments, "open comment")];
    const about = (j.about || "").replace(/\s+/g, " ").trim();
    return `${j.name}${about ? ` · ${about}` : ""}\n${state.filter(Boolean).join(" · ")}`;
  }
  async function copyText(text, button) {
    try { await navigator.clipboard.writeText(text); } catch { prompt("Copy this:", text); return; }
    button.classList.add("ok");
    if (!button.querySelector("span")) button.insertAdjacentHTML("beforeend", "<span>Copied</span>");
    setTimeout(() => { button.classList.remove("ok"); button.querySelector("span")?.remove(); }, 1500);
  }

  // ---- asking about the whole jelly ------------------------------------------

  // A comment without an anchor is about the whole jelly. It reaches the agent
  // like any comment (inbox, `jelly waiting`); its thread shows here, beside
  // the Ask button, because there is no element in the view to pin it to.
  const lastAt = (c) => Math.max(c.at_ms, ...(c.replies || []).map((r) => r.at_ms));
  // Open threads, plus resolved ones from the last day so the person sees the answer.
  const wholeThreads = (j) => (j?.whole_jelly_comments || []).filter((c) => !c.resolved || Date.now() - lastAt(c) < DAY);
  const agentLast = (c) => !c.resolved && c.replies?.length && !jelly.isPerson(c.replies.at(-1).by);
  function askButton(j) {
    const t = wholeThreads(j), waitingOn = t.some(agentLast);
    const cls = (t.length ? " has" : "") + (waitingOn ? " waiting" : "") + (ask?.name === j.name ? " on" : "");
    const title = waitingOn ? "Your agent replied about this jelly" : "Ask your agent about this whole jelly";
    return `<button class="btn${cls}" data-act="ask" title="${title}">Ask agent${t.length ? ` · ${t.length}` : ""}</button>`;
  }

  let ask = null; // the open panel: { name, el }
  function openAsk(name) {
    if (ask?.name === name) return closeAsk();
    closeAsk();
    const el = document.createElement("div");
    el.className = "askpop";
    el.innerHTML = `<div class="ap-h"><b>About this whole jelly</b><button class="btn quiet" data-ap="close" title="Close (Esc)">✕</button></div>
      <div class="ap-list"></div>
      <textarea class="ap-new" rows="3" placeholder="Ask your agent about this jelly"></textarea>
      <div class="ap-row"><span>Your agent gets it like a comment. Replies show here.</span><button class="btn" data-ap="send">Send</button></div>`;
    document.body.appendChild(el);
    ask = { name, el };
    el.addEventListener("click", (e) => {
      const b = e.target.closest("[data-ap]");
      if (!b) return;
      if (b.dataset.ap === "close") closeAsk();
      if (b.dataset.ap === "send") sendAsk(el.querySelector(".ap-new"));
      if (b.dataset.ap === "resolve") act(`/api/jellies/${enc(name)}/resolve`, { id: b.dataset.id });
    });
    el.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || e.shiftKey || e.isComposing || !e.target.matches("textarea, input")) return;
      e.preventDefault();
      sendAsk(e.target);
    });
    redrawAsk();
    el.querySelector(".ap-new").focus();
  }
  function closeAsk() {
    if (!ask) return;
    ask.el.remove();
    ask = null;
    if (full && byName(full)) $("fask").innerHTML = askButton(byName(full));
  }
  // A field with data-id replies on that thread; the new-question field starts one.
  async function sendAsk(field) {
    const text = field.value.trim();
    if (!text || !ask) return;
    const id = field.dataset.id;
    const ok = await act(`/api/jellies/${enc(ask.name)}/${id ? "reply" : "comment"}`, id ? { id, text } : { anchor: null, text });
    if (ok) field.value = "";
  }
  // Under its button, inside the window.
  function placeAsk() {
    if (!ask) return;
    const b = $("fask").querySelector("button");
    if (!b) return closeAsk();
    const r = b.getBoundingClientRect(), w = Math.min(360, innerWidth - 16), el = ask.el;
    el.style.width = w + "px";
    el.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
    el.style.top = r.bottom + 6 + "px";
    el.style.maxHeight = Math.max(160, innerHeight - r.bottom - 18) + "px";
  }
  // Threads change under an open panel; drafts in its reply fields survive.
  function redrawAsk() {
    if (!ask) return;
    const j = byName(ask.name);
    if (!j || full !== ask.name) return closeAsk();
    const list = ask.el.querySelector(".ap-list");
    const drafts = new Map([...list.querySelectorAll("input[data-id]")].map((i) => [i.dataset.id, i.value]));
    const focused = document.activeElement?.dataset?.id;
    list.innerHTML = wholeThreads(j).map((c) => `<div class="ap-t">${[c, ...(c.replies || [])].map((m) => `<div class="ap-m${jelly.isPerson(m.by) ? "" : " agent"}"><b>${esc(who(m.by))}</b>${esc(m.text)}</div>`).join("")}
      ${c.resolved ? '<div class="ap-done">Resolved</div>' : `<div class="ap-reply"><input data-id="${esc(c.id)}" placeholder="Reply" aria-label="Reply"><button class="btn quiet" data-ap="resolve" data-id="${esc(c.id)}">Resolve</button></div>`}</div>`).join("");
    for (const i of list.querySelectorAll("input[data-id]")) { i.value = drafts.get(i.dataset.id) || ""; if (i.dataset.id === focused) i.focus(); }
    $("fask").innerHTML = askButton(j);
    placeAsk();
  }
  addEventListener("pointerdown", (e) => { if (ask && !ask.el.contains(e.target) && !e.target.closest('[data-act="ask"]')) closeAsk(); });
  addEventListener("resize", placeAsk);

  // ---- shape --------------------------------------------------------------

  // A jelly whose view changed asks to reload (runtime.js). Its next version
  // loads in a hidden copy of the frame and replaces the old one once it has
  // drawn, with scroll and focus carried over, so the person never sees a blank
  // frame. Moving an iframe reloads it, so the copy is placed beside the old one
  // from the start and only its class changes.
  const viewRevs = new Map(); // name -> newest view revision seen in events
  function swap(old) {
    old.next?.remove();
    const f = old.cloneNode(false);
    old.next = f;
    f.swapFor = old;
    f.classList.add("next");
    f.style.setProperty("--w", old.offsetWidth + "px");
    f.style.setProperty("--h", old.offsetHeight + "px");
    f.addEventListener("load", () => {
      const win = f.contentWindow;
      win.requestAnimationFrame(() => win.requestAnimationFrame(() => {
        if (old.next !== f || !old.isConnected) return f.remove();
        const name = win.__JELLY__?.name;
        // Loaded just before a newer shape it may never hear about: go again.
        if (win.__JELLY__?.viewRev < (viewRevs.get(name) || 0)) return swap(old);
        const kept = old.contentWindow?.__jellyCarry?.take();
        const focused = document.activeElement === old;
        old.remove();
        f.classList.remove("next");
        f.style.removeProperty("--w");
        f.style.removeProperty("--h");
        delete f.swapFor;
        if (focused) f.focus();
        win.__jellyCarry?.put(kept);
        if ($("fcomment").classList.contains("on")) win.postMessage({ type: "jelly:comment", on: true }, location.origin);
      }));
    }, { once: true });
    old.after(f);
  }

  // ---- actions --------------------------------------------------------------

  async function act(path, body, method = "POST") {
    const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify({ ...body, by: jelly.person.by }) });
    if (!r.ok) alert((await r.json().catch(() => ({}))).error || "That did not work.");
    return r.ok;
  }
  const keep = (name) => { const j = byName(name); if (!j) return; return j.archived ? act(`/api/jellies/${enc(name)}/restore`, {}) : act(`/api/jellies/${enc(name)}/keep`, { kept: !j.kept }); };

  // Remove takes the jelly off the list at once and deletes it ten seconds
  // later, so a slip can be taken back. A second remove, or leaving the page,
  // settles the first.
  const removing = new Map(); // name -> the timer that deletes it
  const removeUrl = (name) => `/api/jellies/${enc(name)}?by=${enc(jelly.person.by)}`;
  function remove(name) {
    if (shared(name)) return alert(`${name} is shared. Stop sharing it first.`);
    for (const n of [...removing.keys()]) settle(n);
    removing.set(name, setTimeout(() => settle(name), 10000));
    $("toast").innerHTML = `<span>Removed <b>${esc(tail(name))}</b></span><button id="unremove">Undo</button><i></i>`;
    $("toast").hidden = false;
    if (full === name) closeFull(); else render();
  }
  async function settle(name) {
    clearTimeout(removing.get(name));
    $("toast").hidden = true;
    // The row stays hidden until the list comes back without it; if the daemon refuses, it returns.
    // A jelly that was moved meanwhile has another name now, and stays.
    if (byName(name)) await act(removeUrl(name), null, "DELETE");
    removing.delete(name);
    refresh();
  }
  // Takes a remove back: the person pressed Undo, or an agent touched the jelly
  // while it waited, and what the agent just did must not be deleted.
  function unremove(name) {
    if (!removing.has(name)) return;
    clearTimeout(removing.get(name));
    removing.delete(name);
    $("toast").hidden = true;
    render();
  }
  $("toast").addEventListener("click", (e) => { if (e.target.id === "unremove") for (const name of [...removing.keys()]) unremove(name); });
  addEventListener("pagehide", () => { for (const name of removing.keys()) fetch(removeUrl(name), { method: "DELETE", keepalive: true }); });

  // The ··· on a row: what is done on purpose, so one step further away than copy.
  let menuFor = null;
  function openMenu(name, button) {
    if (menuFor === name && !$("menu").hidden) return closeMenu();
    closeMenu(); hidePeek();
    const j = byName(name), m = $("menu");
    menuFor = name;
    button.classList.add("on");
    const others = [...new Set([...projects.map((p) => p.name), ...jellies.map((x) => x.project)])].filter((p) => p && p !== j.project).sort();
    m.innerHTML = `<div class="mh">${esc(j.name)}</div>
      <button role="menuitem" data-m="keep">${j.archived ? "Restore" : j.kept ? "Stop keeping" : "Keep"}</button>
      <button role="menuitem" class="bad" data-m="remove">Remove</button>
      ${others.length ? `<div class="ms">Move to</div>${others.map((p) => `<button role="menuitem" data-m="move" data-p="${esc(p)}">${esc(p)}</button>`).join("")}` : ""}`;
    m.hidden = false;
    const r = button.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
    m.style.top = Math.max(8, r.bottom + 4 + h > innerHeight - 8 ? r.top - h - 4 : r.bottom + 4) + "px";
    m.querySelector("button").focus();
  }
  function closeMenu() {
    if ($("menu").hidden) return;
    $("menu").hidden = true;
    document.querySelectorAll(".dots.on").forEach((d) => d.classList.remove("on"));
  }
  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest("[data-m]");
    if (!b) return;
    const name = menuFor;
    closeMenu();
    if (b.dataset.m === "keep") keep(name);
    if (b.dataset.m === "remove") remove(name);
    if (b.dataset.m === "move") act(`/api/jellies/${enc(name)}/move`, { project: b.dataset.p });
  });
  addEventListener("pointerdown", (e) => { if (!e.target.closest("#menu, .dots")) closeMenu(); });

  // Rest on a row for half a second: a small live look at that jelly, or its poster if it has one.
  let peekTimer = 0, peekName = null;
  function showPeek(el) {
    const j = byName(el.dataset.name);
    if (!j || full || !$("menu").hidden) return;
    peekName = j.name;
    const src = `/j/${enc(j.name)}/`, p = $("peek");
    p.innerHTML = `<div class="shot">${j.poster ? `<img alt="" src="${src}assets/${enc(j.poster)}">` : `<iframe tabindex="-1" title="" src="${src}"></iframe>`}</div><div class="cap"><span>${esc(j.name)}</span><span>v${j.version}</span></div>`;
    p.hidden = false;
    const r = el.getBoundingClientRect(), w = 404, h = p.offsetHeight;
    p.style.left = Math.max(8, Math.min(r.left + 140, innerWidth - w - 8)) + "px";
    p.style.top = Math.max(8, r.bottom + 6 + h > innerHeight - 8 ? r.top - h - 6 : r.bottom + 6) + "px";
  }
  function hidePeek() { clearTimeout(peekTimer); peekName = null; $("peek").hidden = true; $("peek").innerHTML = ""; }
  $("list").addEventListener("mouseover", (e) => {
    const r = e.target.closest(".row");
    if (r && r.dataset.name === peekName) return;
    hidePeek();
    if (r) peekTimer = setTimeout(() => showPeek(r), 500);
  });
  $("list").addEventListener("mouseleave", hidePeek);
  $("list").addEventListener("scroll", () => { hidePeek(); closeMenu(); }, { passive: true });

  // Projects: make one, remove an empty one. A jelly moves between them from its ··· menu.
  // There is no rename here: agents in a repo use the project named after it, and a
  // rename would cut them off from their jellies. `jelly project OLD --move NEW` does it.
  const projectAt = (p) => `/api/projects/${enc(p)}`;
  async function finishEdit(input) {
    const name = input.value.trim();
    if (!name) { ui.edit = null; return render(); }
    if (await act("/api/projects", { name })) location.href = `/p/${enc(name)}`;
  }
  $("app").addEventListener("input", (e) => { if (ui.edit && e.target.classList.contains("pin")) ui.edit.value = e.target.value; });
  $("app").addEventListener("keydown", (e) => {
    if (!e.target.classList.contains("pin")) return;
    if (e.key === "Enter") finishEdit(e.target);
    if (e.key === "Escape") { e.stopPropagation(); ui.edit = null; render(); }
  });
  // A field takes focus once, when it opens, and goes when focus leaves it.
  function startEdit() {
    ui.edit = { value: "" };
    render();
    $("newproject").focus();
  }
  $("app").addEventListener("focusout", (e) => {
    if (redrawing || !ui.edit || !e.target.classList.contains("pin")) return;
    ui.edit = null;
    render();
  });
  $("rail").addEventListener("click", (e) => { if (e.target.id === "addproject") startEdit(); });

  $("list").addEventListener("click", async (e) => {
    const t = (sel) => e.target.closest(sel);
    if (t("[data-arch]")) { ui.archived.add(t("[data-arch]").dataset.arch); return render(); }
    if (t("[data-rmproject]")) { const p = t("[data-rmproject]").dataset.rmproject; if (await act(projectAt(p), null, "DELETE")) { if (PROJECT === p) location.href = "/"; else refresh(); } return; }
    if (t("#shared")) return shareClick(e);
    if (t("a, input")) return;
    const name = t(".row")?.dataset.name;
    if (!name) return;
    const b = t("[data-act]");
    if (b?.dataset.act === "copy") return copyText(reference(byName(name)), b);
    if (b?.dataset.act === "menu") return openMenu(name, b);
    openFull(name);
    if (t("#waiting")) attend(name, openAsks.find((a) => a.jelly === name)?.id);
  });
  document.querySelector(".fbar").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b?.dataset.act === "ask") openAsk(full);
    if (b?.dataset.act === "copy") copyText(reference(byName(full)), b);
  });
  $("back").onclick = () => closeFull();
  $("fnext").onclick = nextWaiting;
  $("fcomment").onclick = toggleComment;
  $("fundo").onclick = () => act(`/api/jellies/${enc(full)}/undo`, {});
  $("fkeep").onclick = () => keep(full);
  $("frm").onclick = () => remove(full);
  $("q").addEventListener("input", (e) => { ui.q = e.target.value.trim(); render(); });

  // The page's shortcuts, for keys typed on the page and keys a jelly passes up.
  // Returns true when the key did something. Letters ignore Caps Lock.
  function shortcut(key) {
    if (key.length === 1) key = key.toLowerCase();
    if (key === "Escape" && ask) return closeAsk(), true;
    if (key === "Escape" && !$("menu").hidden) return closeMenu(), true;
    if (key === "Escape" && full) return closeFull(), true;
    if (key === "n") return nextWaiting(), true;
    if (full) return key === "c" ? (toggleComment(), true) : false;
    if (key === "/") return $("q").focus(), $("q").select(), true;
    if (["j", "k", "ArrowDown", "ArrowUp"].includes(key)) {
      const all = [...$("list").querySelectorAll(".row .open")], i = all.indexOf(document.activeElement), down = key === "j" || key === "ArrowDown";
      const to = all[i < 0 ? 0 : Math.max(0, Math.min(all.length - 1, i + (down ? 1 : -1)))];
      if (to) { to.focus(); to.scrollIntoView({ block: "nearest" }); }
      return true;
    }
    return false;
  }
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && ask) return closeAsk();
    if (e.key === "Escape" && e.target === $("q")) { $("q").value = ui.q = ""; $("q").blur(); return render(); }
    if (e.target.closest("input, textarea, select") || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
    if (shortcut(e.key) && (e.key.startsWith("Arrow") || e.key === "/")) e.preventDefault();
  });

  // ---- live -----------------------------------------------------------------

  function jiggle(el, cls = "jig") { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
  let lastWaiting = null;
  async function refresh() {
    const json = (url) => fetch(url).then((r) => r.json());
    [jellies, projects, openAsks] = await Promise.all([json("/api/jellies"), json("/api/projects"), json(`/api/asks?project=${enc(PROJECT || "")}`)]);
    jellies = jellies.filter((j) => j.name !== "page");
    render();
    if (full) renderFull();
    redrawAsk();
    // Nothing waits on the person any more: the blob hops.
    const n = waiting().length;
    if (lastWaiting > 0 && n === 0) jiggle($("logo"), "happy");
    lastWaiting = n;
    if (!booted) {
      booted = true;
      if (jelly.state.shown && byName(jelly.state.shown)) openFull(jelly.state.shown, true);
    }
  }

  // An agent asked and this tab is not in front: a browser notification, if
  // the person turned them on. Clicking it brings the tab forward on that jelly.
  const canNotify = typeof Notification !== "undefined";
  $("notify").hidden = !canNotify || Notification.permission !== "default";
  $("notify").onclick = async () => {
    await Notification.requestPermission();
    $("notify").hidden = true;
    dispatchEvent(new Event("visibilitychange")); // tell the daemon again: it reports whether this browser notifies
  };
  function notify(ev) {
    if (ev.kind !== "ask" || jelly.isPerson(ev.by) || document.visibilityState === "visible") return;
    if (!canNotify || Notification.permission !== "granted") return;
    // The tag makes two open jelly pages show one notification, not two.
    const n = new Notification(ev.args?.title || "An agent asks you something", { body: ev.jelly, tag: `${ev.jelly}:${ev.args?.id}` });
    n.onclick = () => { focus(); n.close(); if (byName(ev.jelly)) openFull(ev.jelly); else location.href = `/j/${enc(ev.jelly)}/`; };
  }

  // One refresh per burst of changes, 120 ms after the last. A jelly that never
  // pauses (a game reporting positions) would push it back for good, so a
  // burst refreshes at least once a second.
  let pending = null, burstAt = 0;
  jelly.events((ev) => {
    $("live").classList.add("live");
    if (ev.jelly === "page") return;
    notify(ev);
    if (ev.view_rev) viewRevs.set(ev.jelly, ev.view_rev);
    if (!jelly.isPerson(ev.by)) { jiggle($("logo")); unremove(ev.jelly); }
    clearTimeout(pending);
    burstAt ||= Date.now();
    pending = setTimeout(() => { burstAt = 0; refresh(); }, Math.min(120, burstAt + 1000 - Date.now()));
  });
  function applyFocus(s) {
    if (s.shown) unremove(s.shown); // an agent shows it: it is wanted
    if (s.shown && s.shown !== full) openFull(s.shown, true);
    if (!s.shown && full) closeFull(true);
  }
  // An agent focusing the page opens that jelly full size; null closes it.
  jelly.onState((s, ev) => {
    if (!ev || !booted) return;
    if (ev.verb === "show" && pendingFocusWrites) return;
    if (ev.verb === "seen") return render(); // a jelly was looked at: its mark goes
    applyFocus(s);
  });
  // Keep "3m ago" and "archives in 5h" honest, and pick up a project made from the CLI.
  setInterval(() => (document.hidden ? 0 : refresh()), 30000);

  // ---- shares: what is shared, for how long, who opened it, stop it ------------
  async function loadShares() {
    // Who opened a link and who is here now is asked of the relay, and only
    // while a share's people are showing: an idle page costs the relay nothing.
    let list;
    try { list = await (await fetch(ui.share ? "/api/shares?here=true" : "/api/shares")).json(); } catch { return; }
    shares = Array.isArray(list) ? list : [];
    if (ui.share && !shared(ui.share)) ui.share = null;
    render();
  }
  async function shareClick(e) {
    const b = e.target.closest("[data-share-open], [data-share-who], [data-stop], [data-copylink], [data-revoke]");
    if (!b) return;
    if (b.dataset.shareOpen) return openFull(shares[b.dataset.shareOpen].jelly);
    if (b.dataset.shareWho) { const name = shares[b.dataset.shareWho].jelly; ui.share = ui.share === name ? null : name; return loadShares(); }
    const [i, k] = (b.dataset.stop ?? b.dataset.copylink ?? b.dataset.revoke).split(":"), s = shares[i], p = s.people[k];
    if (b.dataset.copylink) return copyText(s.links[p.who], b);
    const what = p ? `Stop ${p.who || "the view-only link"} on ${s.jelly}? Their link stops working and their open page closes.`
      : `Stop sharing ${s.jelly}? Every link stops working. The jelly stays here with its last state.`;
    if (!confirm(what)) return;
    const r = await fetch(`/api/jellies/${enc(s.jelly)}/share${p ? `?to=${enc(p.who)}` : ""}`, { method: "DELETE" });
    if (!r.ok) alert((await r.json().catch(() => ({}))).error || "Could not stop it.");
    loadShares();
  }
  // What is shared, and who is here, change without any event reaching this page, so ask again now and then.
  setInterval(loadShares, 20000);
  loadShares();

  // ---- a newer jelly ---------------------------------------------------------
  // The daemon asks npm once a day. This page asks the daemon every hour, and
  // every second while an update runs: the daemon's new start time says the new
  // jelly is up, and the page reloads to get its own new version.
  let release = null, updating = false, releaseTimer = 0, laterFor = null;
  try { laterFor = localStorage.getItem("jelly.later"); } catch {}
  function drawUpdate() {
    const v = release, el = $("update");
    el.hidden = !(updating || ((v.newer || v.failed) && laterFor !== v.latest));
    if (el.hidden) return;
    const row = (html) => `<div class="row"><i class="jy-mark"></i><span>${html}</span></div>`;
    const head = row(`<b>jelly ${esc(v.latest)} is out.</b> You have ${esc(v.version)}.`);
    const buttons = (action) => `<div class="row">${action ? `<button class="jy-action" data-update>${action}</button>` : ""}<button class="btn quiet" data-later>Later</button></div>`;
    el.innerHTML = updating ? row(`<b>Updating to jelly ${esc(v.latest)}.</b> This page reloads when it is ready.`)
      : v.failed ? `${head}<div>The update did not work: ${esc(v.failed)}</div>${buttons("Try again")}`
      : v.install === "npm" ? head + buttons("Update now")
      : `${head}<div>This one was built from source. Ask your agent to run:${v.commands.map((c) => `<code>${esc(c)}</code>`).join("")}</div>${buttons("")}`;
  }
  async function checkRelease() {
    clearTimeout(releaseTimer);
    try {
      const v = await (await fetch("/api/version")).json();
      if (release && v.started_ms !== release.started_ms) return location.reload();
      release = v; updating = v.updating;
      drawUpdate();
    } catch {} // the daemon is starting again
    releaseTimer = setTimeout(checkRelease, updating ? 1000 : 3600e3);
  }
  $("update").addEventListener("click", async (e) => {
    if (e.target.closest("[data-later]")) {
      laterFor = release.latest;
      try { localStorage.setItem("jelly.later", laterFor); } catch {}
      return drawUpdate();
    }
    if (!e.target.closest("[data-update]")) return;
    const r = await fetch("/api/update", { method: "POST" });
    if (!r.ok) return alert((await r.json()).error);
    checkRelease();
  });
  checkRelease();
  // Unnamed, everything this browser does is "person", as it always was.
  const drawMe = () => { $("me").textContent = jelly.person.name ? `You: ${jelly.person.name}` : "Set your name"; };
  $("me").onclick = () => {
    const name = prompt("Your name, so others on these jellies can tell what you did. Leave it empty to stay unnamed.", jelly.person.name);
    if (name === null) return;
    jelly.person.name = name;
    drawMe();
    render();
  };
  drawMe();
  $("live").classList.add("live");
  refresh();
</script>
</body>
</html>
