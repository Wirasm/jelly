<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jelly-attention" content="inline">
<title>ask</title>
<style>
  /* Berry by day, Night jelly by night: jelly's own colours. */
  :root {
    --bg: #fff8f3; --card: #ffffff; --ink: #2a1620; --ink-2: #4a3340; --muted: #8a6b78; --line: #f0dfe5; --line-2: #e2c6d1; --soft: #fdf0f4;
    --accent: #c8255d; --accent-2: #e8336f; --accent-soft: #ffe1ec; --accent-line: #f5b8cd; --sun-soft: #fff1c7; --sun-ink: #6b4700;
    --good: #2f7d3b; --good-soft: #e3f3e6; --bad: #b8382f; --stage: #2a1620; --stage-ink: #fff4f8;
    color-scheme: light;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #14111c; --card: #1d1928; --ink: #f1ecf7; --ink-2: #d6cde4; --muted: #a79dbb; --line: #2e2740; --line-2: #3d3454; --soft: #241f31;
    --accent: #ff6b9b; --accent-2: #ff4f8b; --accent-soft: #3a1e2e; --accent-line: #6b2f4a; --sun-soft: #3a3014; --sun-ink: #ffcf3f;
    --good: #6fd38a; --good-soft: #1d3324; --bad: #ff7a70; --stage: #0e0c14; --stage-ink: #f1ecf7;
    color-scheme: dark;
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px 80px; }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 11px 28px; margin: 0 -28px 24px;
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar.done { background: var(--stage); color: var(--stage-ink); border-color: var(--stage); }
  .bar b { font-size: 14px; }
  .meter { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent-2); transition: width .4s; }
  .dots { display: flex; gap: 4px; }
  .dots a { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 11.5px -apple-system, sans-serif; text-decoration: none; color: var(--muted); border: 1px solid var(--line-2); }
  .dots a.ok { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
  .bar .hint { font-size: 13px; color: var(--muted); } .bar.done .hint { color: inherit; opacity: .8; }

  .kicker { font: 600 11.5px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 8px 0 10px; text-wrap: balance; }
  .context { color: var(--ink-2); max-width: 820px; white-space: pre-wrap; margin: 0; }
  .applied { margin-top: 18px; padding: 12px 16px; border-radius: 12px; background: var(--good-soft); color: var(--good); font-weight: 600; }
  .applied span { font-weight: 400; color: var(--ink-2); }
  .empty { margin-top: 40px; color: var(--muted); }

  .q { margin-top: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px 20px; scroll-margin-top: calc(var(--bar-height, 54px) + 16px); }
  .q.answered { border-color: var(--accent-line); }
  .qh { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; }
  .num { width: 30px; height: 30px; border-radius: 9px; background: var(--soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
  .q.answered .num { background: var(--accent-2); color: #fff; }
  .qh h2 { margin: 2px 0 0; font-size: 20px; line-height: 1.3; letter-spacing: -.01em; }
  .qh .qc { margin: 6px 0 0; color: var(--ink-2); white-space: pre-wrap; }
  .state { font-size: 12.5px; color: var(--muted); white-space: nowrap; padding-top: 6px; }
  .q.answered .state { color: var(--accent); font-weight: 600; }
  .rec { margin: 16px 0 0 46px; padding: 11px 14px; border-radius: 12px; background: var(--soft); }
  .rec b { color: var(--accent); }
  .rec span { color: var(--ink-2); }

  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; margin: 16px 0 0 46px; }
  .opt { position: relative; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); display: flex; flex-direction: column; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .opt:hover { border-color: var(--line-2); }
  .opt.rec-o { border-color: var(--accent-line); }
  .opt.picked { border-color: var(--accent-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-2) 18%, transparent); }
  .q.answered .opt:not(.picked) { opacity: .62; }
  .oh { display: flex; gap: 8px; align-items: center; padding: 12px 14px 0; flex-wrap: wrap; }
  .letter { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 12px -apple-system, sans-serif; flex: none; }
  .opt.picked .letter { background: var(--accent-2); color: #fff; }
  .oh b { font-size: 15.5px; }
  .chip { font: 600 10.5px -apple-system, sans-serif; border-radius: 99px; padding: 2px 8px; }
  .chip.r { background: var(--accent-2); color: #fff; } .chip.e { background: var(--soft); color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-weight: 500; }
  .pv { position: relative; margin: 12px 14px 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .pv iframe { display: block; width: 100%; height: 260px; border: 0; background: #fff; }
  .pv .x { position: absolute; right: 8px; bottom: 8px; font: 600 11.5px -apple-system, sans-serif; background: rgba(0,0,0,.65); color: #fff; border: 0; border-radius: 7px; padding: 4px 9px; opacity: 0; transition: opacity .15s; }
  .pv:hover .x { opacity: 1; }
  .does { padding: 10px 14px 0; color: var(--ink-2); font-size: 14px; margin: 0; }
  .gc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 14px 0; font-size: 13px; }
  .gc b { display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 3px; }
  .gc .g b { color: var(--good); } .gc .c b { color: var(--bad); }
  .gc ul { margin: 0; padding-left: 15px; color: var(--ink-2); } .gc li { margin: 2px 0; }
  .pick { margin: 12px 14px 14px; margin-top: auto; padding-top: 12px; }
  .pick button { width: 100%; padding: 9px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--card); font-weight: 600; }
  .pick button:hover { border-color: var(--accent-2); color: var(--accent); }
  .opt.picked .pick button { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

  .note { margin: 14px 0 0 46px; display: flex; gap: 8px; align-items: flex-start; }
  .note textarea { flex: 1; min-height: 44px; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; resize: vertical; }
  .note textarea:focus { outline: none; border-color: var(--accent-2); }
  .note button { white-space: nowrap; padding: 9px 13px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--card); font-weight: 600; font-size: 13.5px; }
  .note button:hover { border-color: var(--accent-2); }
  .said { margin: 10px 0 0 46px; font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--accent-line); padding-left: 10px; white-space: pre-wrap; }

  .more { margin-top: 34px; border: 1.5px dashed var(--line-2); border-radius: 16px; padding: 18px 20px; }
  .more h3 { margin: 0 0 4px; font-size: 16px; } .more p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .more .note { margin: 0; }
  .added { margin-top: 12px; display: grid; gap: 6px; }
  .added div { font-size: 14px; padding: 8px 12px; border-radius: 10px; background: var(--soft); white-space: pre-wrap; }
  .added small { display: block; color: var(--muted); font-size: 11.5px; }
  details.past { margin-top: 30px; color: var(--ink-2); }
  details.past summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.past .row { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .big { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 24px; }
  .big iframe { width: min(1200px, 100%); height: min(860px, 100%); border: 0; border-radius: 14px; background: #fff; }
  @media (max-width: 760px) { .wrap { padding: 0 14px 60px; } .bar { padding: 10px 14px; margin: 0 -14px 18px; } .rec, .opts, .note, .said { margin-left: 0; } .qh { grid-template-columns: 30px 1fr; } .state { grid-column: 2; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar"></div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p class="context" id="context"></p>
  <div id="applied"></div>
  <div id="qs"></div>
  <section class="more" id="more">
    <h3>Add a question or context</h3>
    <p>Something the agent did not ask, or something it should know. It reads these with your answers.</p>
    <div class="note"><textarea id="more-text" placeholder="For example: what happens to existing users?"></textarea><button id="more-send">Send</button></div>
    <div class="added" id="added"></div>
  </section>
  <div id="past"></div>
</div>
<script>
// The questions are attention items on this jelly (made by `jelly ask --spec`).
// Answering one calls jelly.answer: an option, words, or both.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const L = (i) => String.fromCharCode(65 + i);
const qid = (a) => a.anchor?.selector?.replace(/^#q-/, "") ?? a.id;
new ResizeObserver(() => document.documentElement.style.setProperty("--bar-height", `${$("bar").offsetHeight}px`)).observe($("bar"));
const big = new Set(); // previews opened large are rendered once
const drafts = {};     // unsent note text per question, kept across re-renders

function current() {
  const g = `round-${jelly.state.round || 1}`;
  return jelly.items.filter((a) => a.group === g && !a.withdrawn);
}

function render() {
  const s = jelly.state;
  const qs = current();
  const done = qs.filter((a) => a.answer).length;
  const all = qs.length && done === qs.length;
  $("bar").className = "bar" + (all ? " done" : "");
  $("bar").innerHTML = `<b>${done} of ${qs.length} answered</b><span class="meter"><i style="width:${qs.length ? (100 * done) / qs.length : 0}%"></i></span>
    <span class="dots">${qs.map((a, i) => `<a href="#q-${esc(qid(a))}" class="${a.answer ? "ok" : ""}">${i + 1}</a>`).join("")}</span>
    <span class="hint">${all ? "The agent has your answers. Change any of them and it hears about it." : "Pick an option, or write what you think. Each answer reaches the agent right away."}</span>`;
  const by = qs[0]?.by || "the agent";
  $("kicker").textContent = `ask · round ${s.round || 1} · from ${by}`;
  $("title").textContent = s.title || jelly.about || "";
  $("context").textContent = s.context || "";
  $("applied").innerHTML = s.applied ? `<div class="applied">${esc(s.applied.by)} acted on your answers <span>${esc(s.applied.note || "")}</span></div>` : "";
  $("qs").innerHTML = qs.length ? qs.map(question).join("") : `<p class="empty">Waiting for the agent to ask.</p>`;
  for (const a of qs) if (drafts[a.id] !== undefined) { const t = document.querySelector(`[data-note="${a.id}"]`); if (t) t.value = drafts[a.id]; }
  renderAdded();
  renderPast();
}

function question(a, i) {
  const ans = a.answer;
  const picked = ans?.option;
  const rec = a.options.find((o) => o.id === a.recommend);
  const state = !ans ? "not answered" : picked ? `You picked ${L(a.options.findIndex((o) => o.id === picked))}` : "Answered in words";
  return `<section class="q ${ans ? "answered" : ""}" id="q-${esc(qid(a))}">
    <div class="qh"><span class="num">${i + 1}</span><div><h2>${esc(a.title)}</h2>${a.context ? `<p class="qc">${esc(a.context)}</p>` : ""}</div><span class="state">${state}</span></div>
    ${rec ? `<div class="rec"><b>${esc(a.by)} recommends ${L(a.options.indexOf(rec))}: ${esc(rec.label)}.</b> <span>${esc(a.why)}</span></div>` : ""}
    ${a.options.length ? `<div class="opts">${a.options.map((o, k) => option(a, o, k)).join("")}</div>` : ""}
    ${ans?.text ? `<div class="said">You said: ${esc(ans.text)}</div>` : ""}
    <div class="note"><textarea data-note="${esc(a.id)}" placeholder="${a.options.length ? "Add context or a condition. Or, if none of these fit, say what would." : "Your answer"}"></textarea><button data-send="${esc(a.id)}">${a.options.length ? (picked ? "Add to answer" : "Answer in words") : "Answer"}</button></div>
  </section>`;
}

function option(a, o, k) {
  const picked = a.answer?.option === o.id;
  const pv = o.preview ? `<div class="pv"><iframe sandbox="allow-scripts" loading="lazy" title="Preview of ${esc(o.label)}" srcdoc="${esc(o.preview)}"></iframe><button class="x" data-big="${esc(a.id)}|${esc(o.id)}">Expand</button></div>` : "";
  const gc = o.gains?.length || o.costs?.length ? `<div class="gc"><div class="g"><b>Gains</b><ul>${(o.gains || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div><div class="c"><b>Costs</b><ul>${(o.costs || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div></div>` : "";
  return `<div class="opt ${picked ? "picked" : ""} ${o.id === a.recommend ? "rec-o" : ""}">
    <div class="oh"><span class="letter">${L(k)}</span><b>${esc(o.label || o.id)}</b>${o.id === a.recommend ? '<span class="chip r">recommended</span>' : ""}${o.effort ? `<span class="chip e">${esc(o.effort)}</span>` : ""}</div>
    ${pv}${o.does ? `<p class="does">${esc(o.does)}</p>` : ""}${gc}
    <div class="pick"><button data-pick="${esc(a.id)}|${esc(o.id)}">${picked ? "Picked" : `Pick ${L(k)}`}</button></div>
  </div>`;
}

function renderAdded() {
  const mine = jelly.comments.filter((c) => c.anchor?.selector === "#more");
  $("added").innerHTML = mine.map((c) => `<div><small>${c.by === "person" ? "you" : esc(c.by)}${c.replies?.length ? " · the agent replied" : ""}</small>${esc(c.text)}${(c.replies || []).map((r) => `<small style="margin-top:6px">${esc(r.by)}</small>${esc(r.text)}`).join("")}</div>`).join("");
}

function renderPast() {
  const g = `round-${jelly.state.round || 1}`;
  const old = jelly.items.filter((a) => a.group && a.group !== g);
  $("past").innerHTML = old.length ? `<details class="past"><summary>Earlier rounds (${old.length} questions)</summary>${old.map((a) => {
    const o = a.options.find((x) => x.id === a.answer?.option);
    return `<div class="row"><b>${esc(a.title)}</b> · ${a.withdrawn ? "replaced by a newer round" : a.answer ? `${o ? esc(o.label) : "answered in words"}${a.answer.text ? `: “${esc(a.answer.text)}”` : ""}` : "not answered"}</div>`;
  }).join("")}</details>` : "";
}

function find(id) { return jelly.items.find((a) => a.id === id); }
document.addEventListener("click", (e) => {
  const p = e.target.closest("[data-pick]");
  if (p) {
    const [id, option] = p.dataset.pick.split("|");
    const text = document.querySelector(`[data-note="${id}"]`)?.value.trim() || find(id)?.answer?.text || "";
    delete drafts[id];
    return jelly.answer(id, { option, text }).catch((err) => alert(err.message));
  }
  const s = e.target.closest("[data-send]");
  if (s) {
    const id = s.dataset.send, t = document.querySelector(`[data-note="${id}"]`);
    if (!t.value.trim()) return t.focus();
    const option = find(id)?.answer?.option;
    const text = t.value.trim();
    delete drafts[id];
    return jelly.answer(id, { option, text }).catch((err) => alert(err.message));
  }
  const b = e.target.closest("[data-big]");
  if (b) {
    const [id, oid] = b.dataset.big.split("|");
    const o = find(id)?.options.find((x) => x.id === oid);
    const d = document.createElement("div");
    d.className = "big";
    d.innerHTML = `<iframe sandbox="allow-scripts" title="Preview"></iframe>`;
    d.querySelector("iframe").srcdoc = o.preview;
    d.onclick = (ev) => { if (ev.target === d) d.remove(); };
    document.body.appendChild(d);
  }
});
document.addEventListener("input", (e) => { if (e.target.dataset.note) drafts[e.target.dataset.note] = e.target.value; });
addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.querySelector(".big")?.remove();
  // Enter sends a note, Shift+Enter is a new line.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.matches(".note textarea")) {
    e.preventDefault();
    e.target.closest(".note").querySelector("button").click();
  }
});
$("more-send").onclick = () => {
  const t = $("more-text");
  if (!t.value.trim()) return t.focus();
  jelly.comment({ selector: "#more", quote: "Add a question or context" }, t.value.trim()).then(() => (t.value = ""), (err) => alert(err.message));
};

jelly.onState(render);
jelly.onAttention(render);
</script>
</body>
</html>
