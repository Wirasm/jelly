<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>jelly</title>
<meta name="jelly-comment" content="off">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cpath%20d%3D%22M8%2030%20C4%2022%206%2010%2020%209%20C34%2010%2036%2022%2032%2030%20C29%2035%2011%2035%208%2030Z%22%20fill%3D%22%23ff4f8b%22/%3E%3Cellipse%20cx%3D%2215%22%20cy%3D%2216%22%20rx%3D%224%22%20ry%3D%222.4%22%20fill%3D%22%23fff%22%20opacity%3D%22.7%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2224%22%20r%3D%221.9%22%20fill%3D%22%233b0a1e%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%221.9%22%20fill%3D%22%233b0a1e%22/%3E%3C/svg%3E">
<style>
  /* Berry by day, Night jelly by night: the blob logo's own colours. The --dark-*
     names are the pinned panel and chrome, whichever theme is on. */
  :root {
    --page: #fff8f3; --card: #ffffff; --ink: #2a1620; --muted: #8a6b78; --line: #f0dfe5; --line-2: #e2c6d1;
    --bar: #ffffff; --bar-ink: #2a1620; --bar-muted: #9b7b88; --bar-line: #f3e3e8; --chip-on: #2a1620; --chip-on-ink: #ffffff;
    --dark: #fdf0f4; --dark-2: #ffffff; --dark-3: #f8e6ec; --dark-line: #f0dfe5;
    --dark-ink: #2a1620; --dark-muted: #8a6b78; --dark-faint: #b39aa5;
    --brand: #e8336f; --brand-ink: #ffffff; --brand-soft: #ffe1ec; --brand-soft-ink: #a3134c; --brand-glow: rgba(232,51,111,.16);
    --sun: #ffcf3f; --sun-ink: #5a3d00; --sun-soft: #fff1c7;
    --accent: var(--brand); --accent-ink: var(--brand-soft-ink); --warm: var(--sun);
    --panel: rgba(42,22,32,.82); --panel-ink: #ffffff;
    --shadow: rgba(120,30,70,.28);
    color-scheme: light;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root {
    --page: #14111c; --card: #1d1928; --ink: #f1ecf7; --muted: #a79dbb; --line: #2e2740; --line-2: #3d3454;
    --bar: #0e0c14; --bar-ink: #f1ecf7; --bar-muted: #8a809e; --bar-line: #262033; --chip-on: #2c2540; --chip-on-ink: #ffffff;
    --dark: #0e0c14; --dark-2: #1d1928; --dark-3: #2a2438; --dark-line: #2e2740;
    --dark-ink: #f1ecf7; --dark-muted: #a79dbb; --dark-faint: #6f6585;
    --brand: #ff4f8b; --brand-ink: #ffffff; --brand-soft: #3a1e2e; --brand-soft-ink: #ffb3cf; --brand-glow: rgba(255,79,139,.2);
    --sun: #ffcf3f; --sun-ink: #2a1d00; --sun-soft: #3a3014;
    --panel: rgba(29,25,40,.84); --panel-ink: #ffffff;
    --shadow: rgba(0,0,0,.6);
    color-scheme: dark;
  } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden; }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-rows: 44px 1fr; grid-template-columns: 1fr 320px; height: 100%; }
  .app.nopinned { grid-template-columns: 1fr 0; }

  /* top bar */
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line); }
  .top b { font-size: 15px; letter-spacing: -.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dark-faint); }
  .dot.live { background: var(--accent); box-shadow: 0 0 0 3px var(--brand-glow); }
  .top .count { color: var(--dark-faint); font-size: 12px; }
  .projects { display: flex; gap: 2px; margin-left: 10px; overflow-x: auto; min-width: 0; }
  .projects a { color: var(--bar-muted); text-decoration: none; font-size: 12.5px; padding: 4px 10px; border-radius: 7px; white-space: nowrap; }
  .projects a:hover { color: var(--bar-ink); background: var(--brand-soft); }
  .projects a.on { color: var(--chip-on-ink); background: var(--chip-on); }
  .projects a span { opacity: .6; color: inherit; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .top .keys { margin-left: auto; color: var(--dark-faint); font-size: 11px; display: flex; gap: 10px; }
  kbd { font: 10.5px ui-monospace, monospace; border: 1px solid var(--dark-line); border-radius: 4px; padding: 0 4px; color: var(--dark-muted); }

  /* stream */
  .streamwrap { position: relative; min-height: 0; display: grid; }
  .stream { overflow-y: auto; min-height: 0; }
  .col { max-width: 1040px; margin: 0 auto; padding: 24px 28px 40vh; display: flex; flex-direction: column; gap: 28px; }
  .entry { scroll-margin-top: 16px; }
  .entry header { display: grid; grid-template-columns: 28px 1fr auto; column-gap: 10px; align-items: start; margin-bottom: 10px; }
  .av { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 600 12px -apple-system, sans-serif; background: var(--brand-soft); color: var(--brand-soft-ink); grid-row: span 2; }
  .av.person { background: var(--sun-soft); color: var(--sun-ink); }
  .who { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .who b { color: var(--ink); font-weight: 600; }
  .who code { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
  .who .last { color: var(--accent-ink); }
  .entry h2 { grid-column: 2; font-size: 16px; line-height: 1.3; margin: 1px 0 0; font-weight: 600; letter-spacing: -.01em; }
  .tag { font: 600 10.5px -apple-system, sans-serif; border-radius: 999px; padding: 1px 8px; background: var(--sun); color: var(--sun-ink); }
  .tag.soft { background: var(--brand-soft); color: var(--brand-soft-ink); }
  .acts { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
  .entry:hover .acts, .entry.sel .acts, .acts:focus-within, .acts:has(.on) { opacity: 1; }
  .btn { font-size: 12.5px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--line-2); }
  .btn.on { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { background: var(--card); border-color: var(--line); color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .frame { position: relative; border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -18px rgba(16,24,23,.25); transition: box-shadow .2s, border-color .2s; }
  .entry.sel .frame { border-color: var(--line-2); box-shadow: 0 0 0 3px var(--brand-glow), 0 12px 32px -18px var(--shadow); }
  .entry.pulse .frame { animation: pulse 1.2s ease-out; }
  @keyframes pulse { from { box-shadow: 0 0 0 4px var(--brand-glow); } }
  .entry.arrive { animation: arrive .45s cubic-bezier(.2,.8,.3,1); }
  @keyframes arrive { from { opacity: 0; transform: translateY(14px); } }
  .frame.tall { max-height: 760px; }
  .frame .more { display: none; }
  .frame.tall .more { display: flex; position: absolute; left: 0; right: 0; bottom: 0; height: 110px; align-items: flex-end; justify-content: center; padding-bottom: 16px; gap: 8px;
    background: linear-gradient(transparent, var(--card) 70%); }
  .frame iframe { display: block; width: 100%; height: 520px; border: 0; background: var(--card); }
  .end { color: var(--muted); text-align: center; font-size: 12px; padding: 4px 0; }
  .arch { margin: 12px auto 0; max-width: 720px; display: grid; gap: 4px; text-align: left; }
  .ar { display: grid; grid-template-columns: 160px 1fr auto auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .ar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty code { font: 11.5px ui-monospace, monospace; background: var(--line); padding: 1px 6px; border-radius: 4px; color: var(--ink); }
  .empty { max-width: 460px; margin: 18vh auto 0; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--ink); font-size: 18px; margin: 0 0 8px; }
  .newpill { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 5; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--dark); color: var(--dark-ink); border: 0; border-radius: 999px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(0,0,0,.5); }

  /* pinned panel */
  aside { background: var(--dark); color: var(--dark-ink); border-left: 1px solid var(--dark-line); overflow-y: auto; min-height: 0; padding: 4px 12px 16px; }
  .nopinned aside { display: none; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr 0; } aside { display: none; } .top .keys { display: none; } .col { padding: 16px 14px 40vh; } }
  .group { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dark-faint); padding: 14px 4px 8px; display: flex; gap: 6px; }
  .group .n { color: var(--dark-muted); }
  .tag.work { background: var(--brand-soft); color: var(--brand-soft-ink); }
  .tile { display: block; width: 100%; text-align: left; background: var(--dark-2); border: 1px solid var(--dark-line); border-radius: 10px; padding: 0; cursor: pointer; margin-bottom: 10px; overflow: hidden; }
  .thumb { position: relative; height: 168px; overflow: hidden; background: var(--page); }
  .thumb iframe { position: absolute; left: 0; top: 0; width: 1000px; height: 568px; border: 0; transform: scale(.296); transform-origin: 0 0; pointer-events: none; }
  .tile .cap { padding: 8px 11px 9px; }
  .tile .cap b { display: flex; gap: 6px; align-items: center; }
  .tile .cap .n { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--warm); }
  .tile .cap div { color: var(--dark-muted); font-size: 12px; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .quiet-note { color: var(--dark-faint); font-size: 12px; padding: 0 4px; }

  /* full size */
  .full { position: fixed; inset: 44px 0 0 0; z-index: 10; display: flex; flex-direction: column; background: var(--page); animation: open .18s ease-out; }
  @keyframes open { from { opacity: 0; transform: scale(.985); } }
  .full[hidden] { display: none; }
  .fbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); min-height: 54px; }
  .fbar .title { flex: 1; min-width: 0; }
  .fbar h1 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .full iframe { flex: 1; width: 100%; border: 0; background: var(--card); }

  /* ---- brand and motion: calm base, jelly physics at key moments ---- */
  .logo { flex: none; transform-origin: 50% 90%; cursor: pointer; }
  .logo.jig { animation: jig .7s cubic-bezier(.3,1.6,.5,1); }
  .logo.happy { animation: hop 1s cubic-bezier(.3,1.6,.5,1); }
  .logo .eyes { transform-origin: 20px 24px; animation: blink 6s infinite; }
  @keyframes jig { 0% { transform: none; } 25% { transform: scale(1.18,.82); } 50% { transform: scale(.9,1.12); } 75% { transform: scale(1.05,.95); } }
  @keyframes hop { 0% { transform: none; } 30% { transform: translateY(-8px) scale(.9,1.12); } 60% { transform: translateY(0) scale(1.15,.85); } }
  @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
  .word { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
  .entry.arrive { animation: drop .9s cubic-bezier(.3,1.5,.5,1); transform-origin: 50% 0; }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-28px) scale(.96,1.06); } 55% { opacity: 1; transform: translateY(0) scale(1.01,.98); } 80% { transform: scale(.998,1.004); } }
  .badge-new { font: 700 10.5px -apple-system, sans-serif; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; background: #ff4f8b; color: #fff; animation: jig .8s cubic-bezier(.3,1.6,.5,1) both; }
  .badge-upd { font: 700 10.5px -apple-system, sans-serif; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; background: #ffe1ec; color: #b0124f; }
  .entry.unseen .frame { border-color: #ffb3cf; box-shadow: 0 0 0 3px var(--brand-glow), 0 12px 32px -18px var(--shadow); }

  /* ---- attention dock: draggable, expands to hold every item ---- */
  .dock { position: fixed; z-index: 20; right: 24px; bottom: 24px; }
  .dock-btn { width: 42px; height: 42px; border: 0; border-radius: 46% 54% 50% 50% / 52% 48% 52% 48%; background: radial-gradient(circle at 35% 30%, #ffb3cf, #ff4f8b 60%, #d81b60); box-shadow: 0 14px 28px -10px rgba(216,27,96,.6), inset 0 -6px 12px rgba(0,0,0,.18); color: #fff; cursor: grab; display: grid; place-items: center; touch-action: none; }
  .dock-btn:active { cursor: grabbing; }
  .dock-btn.calm { background: radial-gradient(circle at 35% 30%, #fff, #f3d7e2 60%, #e2bccb); color: #a3134c; box-shadow: 0 10px 20px -10px var(--shadow); opacity: .9; }
  .dock-btn.jig { animation: jig .8s cubic-bezier(.3,1.6,.5,1); }
  .dock-n { font: 800 15px -apple-system, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .dock-panel { position: absolute; right: 0; bottom: 50px; width: 270px; max-height: min(60vh, 460px); overflow-y: auto; background: var(--panel); -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2); color: var(--dark-ink); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; box-shadow: 0 18px 40px -18px rgba(0,0,0,.55); padding: 6px; transform-origin: 100% 100%; animation: pop .3s cubic-bezier(.3,1.5,.5,1); }
  .dock.below .dock-panel { bottom: auto; top: 48px; transform-origin: 100% 0; }
  .dock.left .dock-panel { right: auto; left: 0; }
  .dock-h { padding: 4px 6px 6px !important; } .dock-h b { font-size: 12.5px; }
  .ditem { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; color: var(--dark-ink); border-radius: 9px; padding: 7px 8px; cursor: pointer; font-size: 12.5px; }
  .ditem:hover { background: rgba(255,255,255,.08); }
  .ditem i { width: 8px; height: 8px; border-radius: 50%; background: #ff4f8b; }
  .ditem i.look, .ditem i.reply { background: #ffcf3f; }
  .ditem .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ditem .tt small { display: block; color: var(--dark-faint); font: 11px ui-monospace, monospace; }
  .ditem .pg { color: var(--dark-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }
  .dock-h { display: flex; gap: 8px; align-items: center; padding: 4px 4px 8px; }
  .dock-h span { color: var(--dark-faint); font-size: 12px; flex: 1; }
  .dock-h .btn { color: var(--dark-muted); }
  .dock-list { display: grid; gap: 8px; }
  .dock-empty { color: var(--dark-faint); font-size: 13px; padding: 14px 6px; text-align: center; }
  .party { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
  .drop { position: absolute; width: 10px; height: 10px; border-radius: 50% 50% 50% 0; animation: fall 1.4s cubic-bezier(.2,.6,.4,1) forwards; }
  @keyframes fall { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }
  .hl-target { outline: 3px solid #e8336f !important; outline-offset: 4px; border-radius: 6px; transition: outline-color .3s; }
  @media (prefers-reduced-motion: reduce) { .logo, .logo .eyes, .entry.arrive, .badge-new, .dock-btn, .dock-panel, .need.melt, .drop { animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <svg class="logo" id="logo" width="28" height="28" viewBox="0 0 40 40" aria-label="jelly"><defs><radialGradient id="lg" cx="35%" cy="30%"><stop offset="0" stop-color="#ffb3cf"/><stop offset=".55" stop-color="#ff4f8b"/><stop offset="1" stop-color="#d81b60"/></radialGradient></defs><path d="M8 30 C4 22 6 10 20 9 C34 10 36 22 32 30 C29 35 11 35 8 30Z" fill="url(#lg)"/><ellipse cx="15" cy="16" rx="4" ry="2.4" fill="#fff" opacity=".7"/><g class="eyes"><circle cx="16" cy="24" r="1.7" fill="#3b0a1e"/><circle cx="24" cy="24" r="1.7" fill="#3b0a1e"/></g><path class="mouth" d="M18 27.5 Q20 29.3 22 27.5" stroke="#3b0a1e" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg><b class="word">jelly</b><span class="dot" id="live" title="Connected"></span><nav class="projects" id="projects" aria-label="Projects"></nav>
    <span class="keys"><span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>c</kbd> comment</span><span><kbd>p</kbd> pinned</span><span><kbd>a</kbd> attention</span></span>
  </div>
  <div class="streamwrap">
    <main class="stream" id="stream"><div class="col" id="col"></div></main>
    <button class="newpill" id="newpill" hidden></button>
  </div>
  <aside id="board" aria-label="Pinned jellies"></aside>
  <div class="dock" id="dock" hidden>
    <button class="dock-btn" id="dock-btn" title="Attention: drag to move, click to open (a)"><span class="dock-n" id="dock-n">0</span></button>
    <div class="dock-panel" id="dock-panel" hidden><div class="dock-h"><b>Attention</b><span id="dock-sub"></span><button class="btn quiet" id="dock-close" title="Close (Esc)">✕</button></div><div class="dock-list" id="dock-list"></div></div>
  </div>
  <div class="party" id="party" aria-hidden="true"></div>
</div>
<section class="full" id="full" hidden>
  <div class="fbar">
    <button class="btn" id="back" title="Back to the stream (Esc)">← Back</button>
    <div class="title"><h1 id="ftitle"></h1><div class="who" id="fmeta"></div></div>
    <button class="btn" id="fcomment" title="Pin a comment to any part (c)">Comment</button>
    <button class="btn quiet" id="fundo">Undo</button>
    <button class="btn quiet" id="fpin"></button>
    <button class="btn quiet" id="frm">Remove</button>
  </div>
</section>
<script>
  // The stream: every unpinned jelly in the order agents made them, each with
  // the agent's line of why. Beside it: the jellies the person pinned.
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const enc = encodeURIComponent;
  let jellies = [];
  const byName = (n) => jellies.find((j) => j.name === n);
  const entries = new Map();   // name -> stream <article>
  const tiles = new Map();     // name -> pinned tile
  const lastEvent = new Map(); // name -> {text, by, at}
  let sel = null, full = null, booted = false;
  let archived = [], showArchived = false; // jellies hidden after a quiet week
  // /p/<project> is this same page showing one project's jellies; / shows all.
  const PROJECT = location.pathname.startsWith("/p/") ? decodeURIComponent(location.pathname.slice(3)) : null;
  if (PROJECT) document.title = `${PROJECT} · jelly`;

  function ago(ms) {
    const s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }
  // On a project page names show without their project; on All they show in full.
  const short = (n) => (PROJECT && n.startsWith(PROJECT + ":") ? n.slice(PROJECT.length + 1) : n);
  const who = (by) => (by === "person" ? "you" : by || "?");
  let attentionItems = []; // open asks and looks across this page's jellies
  function flags(j) {
    const out = [];
    if (j.working) out.push(`<span class="tag work">${esc(who(j.working.by))} is working</span>`);
    if (j.attention) out.push(`<span class="tag">${j.attention} for you</span>`);
    if (j.replies_waiting) out.push(`<span class="tag soft">${j.replies_waiting} repl${j.replies_waiting > 1 ? "ies" : "y"} for you</span>`);
    else if (j.open_comments) out.push(`<span>${j.open_comments} open comment${j.open_comments > 1 ? "s" : ""}</span>`);
    return out.join("");
  }

  // ---- stream ---------------------------------------------------------------

  // Same origin, so the stream reads each view's height and gives it all the
  // room it needs: one scrollbar for the whole stream, none inside entries.
  // A view that fills its window (height: 100%) keeps the default height.
  function autosize(f) {
    f.addEventListener("load", () => {
      const doc = f.contentDocument;
      if (!doc?.body) return;
      const fit = () => {
        const cs = getComputedStyle(doc.body);
        // Comment popovers float outside the body's flow; make room for them too.
        const pops = [...doc.querySelectorAll(".jf-pop")].map((p) => p.getBoundingClientRect().bottom + 12);
        const h = Math.max(doc.body.scrollHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom), ...pops);
        f.style.height = Math.max(140, Math.min(h, 6000)) + "px";
        // A long jelly folds so the stream stays a stream; Show all unfolds it.
        const frame = f.parentElement;
        if (frame.classList.contains("frame") && !frame.dataset.open) frame.classList.toggle("tall", h > 900);
      };
      new ResizeObserver(fit).observe(doc.body);
      new MutationObserver(fit).observe(doc.body, { childList: true });
      fit();
    });
  }

  // What the person has looked at, per jelly version, kept in the page's own state.
  const seenVersion = (n) => jelly.state.seen?.[n] || 0;
  function freshness(j) {
    const v = seenVersion(j.name);
    if (!v) return "new";
    return j.version > v && j.made_by !== "person" ? "updated" : "";
  }
  function entryHead(j) {
    const last = lastEvent.get(j.name);
    return `<span class="av ${j.made_by === "person" ? "person" : ""}">${esc(who(j.made_by)[0].toUpperCase())}</span>
      <div class="who"><b>${esc(who(j.made_by))}</b><span>${ago(j.created_ms)}</span><code>${esc(short(j.name))}</code>${{ new: '<span class="badge-new">New</span>', updated: '<span class="badge-upd">Updated</span>' }[freshness(j)] || ""}${flags(j)}
        ${last ? `<span class="last">· ${esc(who(last.by))} ${esc(last.text)} ${ago(last.at)}</span>` : ""}</div>
      <h2>${esc(j.about || j.name)}</h2>
      <div class="acts">
        <button class="btn" data-act="comment">Comment</button>
        <button class="btn quiet" data-act="open" title="Open full size (↵)">Open</button>
        <button class="btn quiet" data-act="pin" title="Keep it pinned beside the stream">Pin</button>
        <button class="btn quiet" data-act="rm">Remove</button>
      </div>`;
  }

  function makeEntry(j) {
    const a = document.createElement("article");
    a.className = "entry";
    a.dataset.name = j.name;
    a.innerHTML = `<header></header><div class="frame"></div>`;
    a.querySelector("header").innerHTML = entryHead(j);
    const f = document.createElement("iframe");
    f.src = `/j/${enc(j.name)}/`;
    f.title = j.name;
    autosize(f);
    a.querySelector(".frame").appendChild(f);
    a.querySelector(".frame").insertAdjacentHTML("beforeend", `<div class="more"><button class="btn" data-act="unfold">Show all</button><button class="btn quiet" data-act="open">Open full size</button></div>`);
    return a;
  }

  function renderStream() {
    // Newest first: what an agent just made is at the top.
    const list = jellies.filter((j) => !j.pinned).sort((a, b) => b.created_ms - a.created_ms);
    const col = $("col");
    for (const [name, el] of entries) if (!list.some((j) => j.name === name)) { el.remove(); entries.delete(name); }
    const fresh = [];
    // Insert new entries where they belong without moving old ones: moving an
    // iframe reloads it.
    let prev = null;
    for (const j of list) {
      let el = entries.get(j.name);
      if (!el) {
        el = makeEntry(j);
        entries.set(j.name, el);
        if (prev) prev.after(el); else col.prepend(el);
        if (booted) { el.classList.add("arrive"); fresh.push(el); }
      } else {
        const head = el.querySelector("header");
        const on = head.querySelector(".on"); // keep comment mode across a re-render
        head.innerHTML = entryHead(j);
        if (on) setCommenting(head.querySelector('[data-act="comment"]'), true);
      }
      prev = el;
    }
    col.querySelector(".end")?.remove();
    col.querySelector(".empty")?.remove();
    col.insertAdjacentHTML("beforeend", list.length
      ? `<div class="end">Agents add jellies here as they work. Pinned ones move to the side. Quiet ones archive after a week.${archivedNote()}</div>`
      : (PROJECT ? `<div class="empty"><h2>Nothing in ${esc(PROJECT)} yet</h2>Agents working in that repo put their jellies here. Move one in with <code>jelly project NAME ${esc(PROJECT)}</code>.</div>` : `<div class="empty"><h2>Nothing in the stream</h2>Agents put things here as they work. Ask one to show you something, or run <code>jelly ask</code>.</div>`));
    if (fresh.length) arrived(fresh[0]);
    watchSeen();
  }

  // A jelly counts as seen once most of it has been on screen for a moment.
  const timers = new Map();
  const io = new IntersectionObserver((list) => {
    for (const e of list) {
      const name = e.target.dataset.name;
      if (e.isIntersecting && e.intersectionRatio > .35) {
        if (!timers.has(name)) timers.set(name, setTimeout(() => markSeen(name), 1500));
      } else { clearTimeout(timers.get(name)); timers.delete(name); }
    }
  }, { threshold: [0, .35, .6] });
  function watchSeen() {
    for (const [name, el] of entries) {
      el.classList.toggle("unseen", freshness(byName(name) || {}) === "new");
      if (!el.dataset.watched) { el.dataset.watched = 1; io.observe(el); }
    }
  }
  function markSeen(name) {
    timers.delete(name);
    const j = byName(name);
    if (j && seenVersion(name) < j.version && !document.hidden) jelly.call("seen", { name, version: j.version }).catch(() => {});
  }

  function archivedNote() {
    if (!archived.length) return "";
    const list = showArchived ? `<div class="arch">${archived.map((j) => `<div class="ar"><code>${esc(short(j.name))}</code><span>${esc(j.about)}</span><span>${ago(j.updated_ms)}</span><button class="btn quiet" data-restore="${esc(j.name)}">Restore</button></div>`).join("")}</div>` : "";
    return ` <button class="btn quiet" data-toggle-arch>${showArchived ? "Hide" : "Show"} ${archived.length} archived</button>${list}`;
  }

  function arrived(el) {
    const s = $("stream");
    jiggle($("logo"));
    if (s.scrollTop < 300) return select(el.dataset.name, true);
    const pill = $("newpill");
    pill.textContent = `↑ New: ${byName(el.dataset.name)?.about || el.dataset.name}`;
    pill.hidden = false;
    pill.onclick = () => { pill.hidden = true; select(el.dataset.name, true); };
  }

  // ---- attention dock ---------------------------------------------------------

  let dockOpen = false, lastCount = null;
  let pendingAttend = null;
  // One row per thing to do: a round of questions on an ask page is one row
  // ("3 questions"), a single ask or look is one row, comment replies are one row.
  function attentionCards() {
    const rows = [], groups = new Map();
    for (const a of attentionItems) {
      if (!a.group) { rows.push(a); continue; }
      const k = a.jelly + "/" + a.group;
      if (!groups.has(k)) { const r = { jelly: a.jelly, id: a.id, kind: "ask", title: a.about || a.title, count: 0 }; groups.set(k, r); rows.push(r); }
      groups.get(k).count++;
    }
    const replies = jellies.filter((j) => j.replies_waiting > 0).map((j) => ({ jelly: j.name, kind: "reply", title: `${j.replies_waiting} comment repl${j.replies_waiting > 1 ? "ies" : "y"} from ${who(j.made_by)}` }));
    return [...rows, ...replies];
  }
  // The dock only points: each row opens the jelly the item is on. Answering
  // happens there, next to what it is about.
  function row(a) {
    const pg = a.count ? `${a.count} question${a.count > 1 ? "s" : ""}` : a.kind;
    const item = a.kind === "reply" ? "" : esc(a.id);
    return `<button class="ditem" data-goto="${esc(a.jelly)}" data-item="${item}" title="${esc(a.title)}"><i class="${esc(a.kind)}"></i><span class="tt">${esc(a.title)}<small>${esc(short(a.jelly))}</small></span><span class="pg">${pg}</span></button>`;
  }
  function renderDock() {
    const items = attentionCards();
    const n = items.length;
    $("dock").hidden = false;
    $("dock-n").textContent = n || "✓";
    $("dock-btn").classList.toggle("calm", !n);
    $("dock-btn").title = n ? `${n} for you: click to open, drag to move (a)` : "Nothing waits on you";
    $("dock-sub").textContent = n ? `${n} waiting` : "";
    $("dock-list").innerHTML = n ? items.map(row).join("") : `<div class="dock-empty">Nothing is waiting on you.</div>`;
    if (lastCount !== null && n > lastCount) jiggle($("dock-btn"));
    if (lastCount > 0 && n === 0) celebrate();
    lastCount = n;
  }
  function setDock(on) {
    dockOpen = on;
    $("dock-panel").hidden = !on;
  }
  function jiggle(el) {
    if (!el) return;
    el.classList.remove("jig"); void el.getBoundingClientRect(); el.classList.add("jig");
  }
  function celebrate() {
    const logo = $("logo");
    logo.classList.remove("happy"); void logo.getBoundingClientRect(); logo.classList.add("happy");
    const r = $("dock-btn").getBoundingClientRect();
    const colors = ["#ff4f8b", "#ffcf3f", "#7ee0a8", "#8b7cf6", "#46c4b8"];
    for (let i = 0; i < 18; i++) {
      const d = document.createElement("span");
      d.className = "drop";
      d.style.left = r.left + r.width / 2 + "px";
      d.style.top = r.top + r.height / 2 + "px";
      d.style.background = colors[i % colors.length];
      const a = (Math.PI * 2 * i) / 18;
      d.style.setProperty("--dx", Math.cos(a) * (60 + Math.random() * 60) + "px");
      d.style.setProperty("--dy", Math.sin(a) * (60 + Math.random() * 60) - 40 + "px");
      $("party").appendChild(d);
      setTimeout(() => d.remove(), 1500);
    }
  }
  // Drag the dock anywhere; a click (no drag) opens it. Where you put it is remembered in this browser.
  (function dockDrag() {
    const dock = $("dock"), btn = $("dock-btn");
    const place = (x, y) => {
      x = Math.max(8, Math.min(innerWidth - 62, x)); y = Math.max(52, Math.min(innerHeight - 62, y));
      Object.assign(dock.style, { left: x + "px", top: y + "px", right: "auto", bottom: "auto" });
      dock.classList.toggle("below", y < innerHeight / 2);
      dock.classList.toggle("left", x < innerWidth / 2);
    };
    try { const p = JSON.parse(localStorage.getItem("jelly.dock") || "null"); if (p) place(p.x, p.y); } catch {}
    let start = null, moved = false;
    btn.addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY, r: btn.getBoundingClientRect() }; moved = false; btn.setPointerCapture(e.pointerId); });
    btn.addEventListener("pointermove", (e) => {
      if (!start) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true;
      place(start.r.left + dx, start.r.top + dy);
    });
    btn.addEventListener("pointerup", () => {
      if (moved) { const r = btn.getBoundingClientRect(); try { localStorage.setItem("jelly.dock", JSON.stringify({ x: r.left, y: r.top })); } catch {} }
      else setDock(!dockOpen);
      start = null;
    });
  })();
  $("dock-close").onclick = () => setDock(false);
  $("dock").addEventListener("click", (e) => {

    const g = e.target.closest("[data-goto]");
    if (g) {
      setDock(false);
      openFull(g.dataset.goto);
      pendingAttend = null;
      if (g.dataset.item) {
        const iframe = $("full").querySelector("iframe");
        const request = { iframe, itemId: g.dataset.item };
        pendingAttend = request;
        const send = () => {
          if (pendingAttend !== request || iframe !== $("full").querySelector("iframe")) { iframe.removeEventListener("load", send); return; }
          if (iframe.contentDocument?.readyState !== "complete" || iframe.contentWindow.jelly?.name !== g.dataset.goto) return;
          pendingAttend = null;
          iframe.removeEventListener("load", send);
          iframe.contentWindow.postMessage({ type: "jelly:attend", id: request.itemId }, location.origin);
        };
        iframe.addEventListener("load", send);
        send();
      }
    }
  });

  // ---- pinned ---------------------------------------------------------------

  function renderBoard() {
    const pinned = jellies.filter((j) => j.pinned).sort((a, b) => a.name.localeCompare(b.name));
    const board = $("board");
    for (const [name, t] of tiles) if (!pinned.some((j) => j.name === name)) { t.remove(); tiles.delete(name); }
    renderDock();
    let head = board.querySelector(".pinhead");
    if (!head) { head = document.createElement("div"); head.className = "group pinhead"; board.appendChild(head); }
    head.innerHTML = `Pinned<span class="n">${pinned.length || ""}</span>`;
    board.querySelector(".pinnote")?.remove();
    if (!pinned.length) head.insertAdjacentHTML("afterend", `<div class="quiet-note pinnote">Pin a jelly to keep it here.</div>`);
    // Tiles hold live iframes: keep them and rewrite only the captions.
    let prev = head;
    for (const j of pinned) {
      let t = tiles.get(j.name);
      if (!t) {
        t = document.createElement("button");
        t.className = "tile";
        t.dataset.name = j.name;
        // A jelly's poster (assets/poster.*) stands in for the live thumbnail when it has one.
        t.innerHTML = j.poster
          ? `<div class="thumb"><img alt="" src="/j/${enc(j.name)}/assets/${enc(j.poster)}" style="width:100%;height:100%;object-fit:cover;object-position:top"></div><div class="cap"></div>`
          : `<div class="thumb"><iframe tabindex="-1" src="/j/${enc(j.name)}/"></iframe></div><div class="cap"></div>`;
        tiles.set(j.name, t);
      }
      t.querySelector(".cap").innerHTML = `<b>${esc(short(j.name))}<span class="n">${j.replies_waiting ? "reply for you" : j.open_comments ? j.open_comments + " open" : ""}</span></b><div>${esc(j.about)}</div>`;
      if (prev.nextElementSibling !== t) prev.after(t);
      prev = t;
    }
  }

  // ---- selection, full size -------------------------------------------------

  function select(name, scroll) {
    if (!name) return;
    sel = name;
    for (const [n, el] of entries) el.classList.toggle("sel", n === name);
    if (scroll) entries.get(name)?.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  // Older local focus echoes must not replace a more recent frame.
  let focusWrites = Promise.resolve(), pendingFocusWrites = 0;
  function writeFocus(name) {
    pendingFocusWrites++;
    focusWrites = focusWrites.then(() => jelly.call("focus", { name })).catch((err) => alert("Could not save your view selection. Try the action again.\n" + err.message)).finally(() => {
      pendingFocusWrites--;
      if (!pendingFocusWrites) applyFocus(jelly.state);
    });
  }
  function openFull(name, fromAgent) {
    if (!byName(name)) return;
    if (full !== name) {
      pendingAttend = null;
      full = name;
      $("full").querySelector("iframe")?.remove();
      const f = document.createElement("iframe");
      f.src = `/j/${enc(name)}/`;
      f.title = name;
      $("full").appendChild(f);
    }
    $("full").hidden = false;
    renderFull();
    setCommenting($("fcomment"), false);
    if (!fromAgent) writeFocus(name);
    setTimeout(() => markSeen(name), 800);
  }
  function renderFull() {
    const j = byName(full);
    if (!j) return closeFull();
    $("ftitle").textContent = j.about || j.name;
    $("fmeta").innerHTML = `<code>${esc(short(j.name))}</code><span>by ${esc(who(j.made_by))}</span><span>v${j.version}</span><span>${ago(j.updated_ms)}</span>${flags(j)}`;
    $("fpin").textContent = j.pinned ? "Unpin" : "Pin";
  }
  function closeFull(fromAgent) {
    pendingAttend = null;
    if (!full) return;
    const was = full;
    full = null;
    $("full").hidden = true;
    $("full").querySelector("iframe")?.remove();
    if (entries.has(was)) select(was, true);
    if (!fromAgent) writeFocus(null);
  }

  // ---- comments -------------------------------------------------------------

  function setCommenting(button, on) {
    button.classList.toggle("on", on);
    button.textContent = on ? "Click a part · Esc" : "Comment";
  }
  const frameOf = (name) => (full ? $("full").querySelector("iframe") : entries.get(name)?.querySelector("iframe"));
  const buttonOf = (name) => (full ? $("fcomment") : entries.get(name)?.querySelector('[data-act="comment"]'));
  function toggleComment(name) {
    const f = frameOf(name), b = buttonOf(name);
    if (!f || !b) return;
    const on = !b.classList.contains("on");
    setCommenting(b, on);
    f.contentWindow.postMessage({ type: "jelly:comment", on }, location.origin);
    f.focus();
  }
  addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const d = e.data;
    if (d?.type === "jelly:commenting") { const b = buttonOf(d.name); if (b) setCommenting(b, d.on); }
    if (d?.type === "jelly:show" && byName(d.name)) openFull(d.name);
    if (d?.type === "jelly:escape" && full) closeFull();
  });

  // ---- actions --------------------------------------------------------------

  async function act(path, body, method = "POST") {
    const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify({ ...body, by: "person" }) });
    if (!r.ok) alert((await r.json()).error);
  }
  const pin = (name) => act(`/api/jellies/${enc(name)}/pin`, { pinned: !byName(name).pinned });
  const remove = (name) => { if (confirm(`Remove ${name} and its history?`)) act(`/api/jellies/${enc(name)}?by=person`, null, "DELETE"); };

  $("col").addEventListener("click", (e) => {
    const r = e.target.closest("[data-restore]");
    if (r) return act(`/api/jellies/${enc(r.dataset.restore)}/restore`, {});
    if (e.target.closest("[data-toggle-arch]")) { showArchived = !showArchived; return renderStream(); }
    const name = e.target.closest(".entry")?.dataset.name;
    if (!name) return;
    select(name);
    const b = e.target.closest("[data-act]");
    if (b) ({ comment: () => toggleComment(name), open: () => openFull(name), unfold: () => { const fr = b.closest(".frame"); fr.dataset.open = 1; fr.classList.remove("tall"); }, pin: () => pin(name), rm: () => remove(name) })[b.dataset.act]();
  });
  $("board").addEventListener("click", (e) => {

    const name = e.target.closest("[data-name]")?.dataset.name;
    if (!name) return;
    if (entries.has(name) && !full) select(name, true); else openFull(name);
  });
  $("back").onclick = () => closeFull();
  $("fcomment").onclick = () => toggleComment(full);
  $("fundo").onclick = () => act(`/api/jellies/${enc(full)}/undo`, {});
  $("fpin").onclick = () => pin(full);
  $("frm").onclick = () => remove(full);
  $("stream").addEventListener("scroll", () => {
    const s = $("stream");
    if (s.scrollTop < 200) $("newpill").hidden = true;
  });

  addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape" && dockOpen) return setDock(false);
    if (e.key === "a") return setDock(!dockOpen);
    if (e.key === "Escape" && full) return closeFull();
    if (e.key === "c") return toggleComment(full || sel);
    if (full) return;
    const names = [...entries.keys()].sort((a, b) => byName(b).created_ms - byName(a).created_ms);
    const i = names.indexOf(sel);
    if (e.key === "j" || e.key === "ArrowDown") { select(names[Math.min(names.length - 1, i + 1)], true); e.preventDefault(); }
    if (e.key === "k" || e.key === "ArrowUp") { select(names[Math.max(0, i - 1)], true); e.preventDefault(); }
    if (e.key === "Enter" && sel) openFull(sel);
    if (e.key === "p") $("app").classList.toggle("nopinned");
  });

  // ---- live -----------------------------------------------------------------

  function describe(ev) {
    if (ev.kind === "call") return ev.verb;
    if (ev.kind === "comment") return "commented";
    if (ev.kind === "reply") return "replied on a comment";
    if (ev.kind === "reshape") return "reshaped it";
    if (ev.kind === "working") return ev.args ? `started: ${ev.args}` : "finished";
    if (ev.kind === "attention") return `asked: ${ev.args?.title || ""}`;
    if (ev.kind === "answer") return "answered";
    return ev.kind;
  }

  function renderProjects(all) {
    const counts = {};
    for (const j of all) if (j.project) counts[j.project] = (counts[j.project] || 0) + 1;
    const link = (href, label, n, on) => `<a href="${href}" class="${on ? "on" : ""}">${esc(label)}<span>${n}</span></a>`;
    $("projects").innerHTML = link("/", "All", all.length, !PROJECT)
      + Object.keys(counts).sort().map((p) => link(`/p/${enc(p)}`, p, counts[p], p === PROJECT)).join("")
      + (PROJECT && !counts[PROJECT] ? link(`/p/${enc(PROJECT)}`, PROJECT, 0, true) : "");
  }

  async function refresh() {
    const all = (await (await fetch("/api/jellies")).json()).filter((j) => j.name !== "surface");
    const live = all.filter((j) => !j.archived);
    const scope = (list) => (PROJECT ? list.filter((j) => j.project === PROJECT) : list);
    jellies = scope(live);
    archived = scope(all.filter((j) => j.archived));
    renderProjects(live);
    attentionItems = await (await fetch(`/api/attention?project=${enc(PROJECT || "")}`)).json();
    renderStream();
    renderBoard();
    if (full) renderFull();
    if (!booted) {
      booted = true;
      // Newest is at the top, so the page opens there.
      select([...entries.keys()][0], false);
      if (jelly.state.focus && byName(jelly.state.focus)) openFull(jelly.state.focus, true);
    }
  }

  let pending = null;
  jelly.events((ev) => {
    $("live").classList.add("live");
    if (ev.jelly === "surface") return;
    if (ev.by !== "person") jiggle($("logo"));
    if (ev.kind !== "remove") lastEvent.set(ev.jelly, { text: describe(ev), by: ev.by, at: ev.at_ms || Date.now() });
    const el = entries.get(ev.jelly);
    if (el) { el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
    clearTimeout(pending);
    pending = setTimeout(refresh, 120); // one refresh per burst of changes
  });
  function applyFocus(s) {
    if (s.focus && s.focus !== full) openFull(s.focus, true);
    if (!s.focus && full) closeFull(true);
  }
  // An agent focusing the surface opens that jelly full size; null closes it.
  jelly.onState((s, ev) => {
    if (!ev || !booted) return;
    if (ev.verb === "focus" && pendingFocusWrites) return;
    if (ev.verb === "seen") return renderStream(); // a jelly was looked at: update New / Updated
    applyFocus(s);
  });
  setInterval(() => jellies.length && (renderStream(), renderBoard()), 30000); // keep "3m ago" honest
  $("live").classList.add("live");
  refresh();
</script>
</body>
</html>
