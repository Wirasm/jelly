<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review</title>
<style>
  /* Plain on purpose. With a DESIGN.md in the project its tokens take over. */
  :root {
    --jelly-comment-inset: auto 10px 78px auto;
    --bg: #fbfaf8; --card: #fff; --ink: #1f1a1d; --ink-2: #4c4449; --muted: #857b81; --line: #e8e2e4; --soft: #f4f0f1;
    --accent: var(--color-primary, #c8255d); --r: var(--rounded-md, 14px);
    --good: #2f9a4c; --good-soft: #e3f3e6; --warn: #c98a00; --warn-soft: #fff1c7; --bad: #c9392f; --idle: #b9b0b5;
    --term: #17141c; --term-ink: #e9e4ee; --add: #e6f6e9; --del: #fdeceb; --hunk: #eef1f8;
    color-scheme: light;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #15131a; --card: #1e1b25; --ink: #f1ecf4; --ink-2: #d2c9d8; --muted: #a096aa; --line: #322c3d; --soft: #262130;
    --good: #5fcf80; --good-soft: #1d3324; --warn: #ffcf3f; --warn-soft: #3a3014; --bad: #ff7a70; --idle: #5a5266;
    --term: #0d0b11; --add: #17301e; --del: #3a1c1c; --hunk: #22263a;
    color-scheme: dark;
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 22px 20px 120px; }
  h1 { font-size: 24px; line-height: 1.2; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  #ask { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  #ask::before { content: "“"; } #ask::after { content: "”"; }

  /* ---- the map: what you asked for, wired to the changes made for it ---- */
  #map { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0 90px; margin-top: 22px; align-items: center; }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #wires path { fill: none; stroke-width: 2.5; opacity: .55; }
  .col { display: grid; gap: 10px; position: relative; z-index: 1; }
  .col > small { font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .node { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: var(--r);
    background: var(--card); border: 1.5px solid var(--line); border-left: 6px solid var(--c, var(--idle)); font-size: 14px; line-height: 1.3; }
  .node.on { border-color: var(--c, var(--ink)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--ink)) 22%, transparent); }
  .node .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 13px -apple-system, sans-serif; color: #fff; background: var(--c, var(--idle)); }
  .node .t { flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .node .n { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); white-space: nowrap; }
  .node .q { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 12px -apple-system, sans-serif; display: grid; place-items: center; }
  .open { --c: var(--accent); } .approved { --c: var(--good); } .change, .question { --c: var(--warn); } .mech { --c: var(--idle); }
  .seen, .tested { --c: var(--good); } .unverified { --c: var(--warn); }
  .node.gap { border-style: dashed; cursor: default; --c: var(--warn); } .node.gap.outside { --c: var(--bad); }

  /* Every changed line, as one bar: a segment per change, red for lines in none. */
  #lines { margin-top: 18px; }
  #lines .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; }
  #lines .bar i { all: unset; cursor: pointer; min-width: 4px; background: var(--c, var(--idle)); }
  #lines .bar i.on { outline: 2px solid var(--ink); outline-offset: -2px; }
  #lines .bar i.lost { --c: var(--bad); background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.45) 4px 8px); cursor: default; }
  #lines .cap { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  #lines .cap .off { color: var(--bad); font-weight: 600; }

  /* ---- the stage: one thing at a time ---- */
  #stage { margin-top: 22px; }
  .card { background: var(--card); border: 1.5px solid var(--line); border-top: 5px solid var(--c, var(--idle)); border-radius: var(--r); padding: 18px 20px; }
  .crumbs { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .crumbs .nav { margin-left: auto; display: flex; gap: 6px; }
  .crumbs .nav button { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); font-size: 16px; line-height: 1; }
  .chip { font: 600 11.5px -apple-system, sans-serif; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
  .chip.high { background: var(--bad); color: #fff; } .chip.medium { background: var(--warn-soft); color: var(--ink); } .chip.low { background: var(--good-soft); color: var(--ink); }
  .card h2 { margin: 8px 0 0; font-size: 21px; line-height: 1.25; letter-spacing: -.01em; }
  .why { margin: 4px 0 0; color: var(--ink-2); }

  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .hero.one { grid-template-columns: 1fr; }
  .pane { min-width: 0; border-radius: 10px; overflow: hidden; border: 2px solid var(--idle); background: var(--term); }
  .pane.after { border-color: var(--good); }
  .pane > b { display: block; font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; background: var(--idle); color: #fff; }
  .pane.after > b { background: var(--good); }
  .pane pre { margin: 0; padding: 12px; color: var(--term-ink); white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.55 ui-monospace, Menlo, monospace; }
  .pane pre .p { opacity: .55; }
  .pane iframe { display: block; width: 100%; height: 260px; border: 0; background: #fff; }
  .pane img { display: block; width: 100%; }
  .wipe { position: relative; margin-top: 14px; border-radius: 10px; overflow: hidden; border: 2px solid var(--good); line-height: 0; }
  .wipe img { display: block; width: 100%; }
  .wipe .b { position: absolute; inset: 0; width: var(--w, 50%); overflow: hidden; border-right: 2px solid #fff; }
  .wipe .b img { width: auto; height: 100%; max-width: none; }
  .wipe input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .wipe .tag { position: absolute; top: 8px; font: 600 11px/1.6 ui-monospace, monospace; padding: 1px 8px; border-radius: 99px; background: rgba(0,0,0,.65); color: #fff; }
  .wipe .tag.l { left: 8px; } .wipe .tag.r { right: 8px; }
  .cap2 { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .stat { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; font: 12.5px ui-monospace, Menlo, monospace; color: var(--muted); }
  .boxes { display: flex; gap: 2px; } .boxes i { width: 10px; height: 10px; border-radius: 2px; background: var(--line); } .boxes i.a { background: var(--good); } .boxes i.d { background: var(--bad); }
  details > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 8px; }
  pre.diff { margin: 6px 0 0; font: 12.5px/1.5 ui-monospace, Menlo, monospace; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; }
  .diff span { display: block; padding: 0 10px; min-width: max-content; white-space: pre; }
  .diff .a { background: var(--add); } .diff .d { background: var(--del); } .diff .h { background: var(--hunk); color: var(--muted); } .diff .f { color: var(--muted); font-weight: 600; }
  pre.ev { margin: 6px 0 0; background: var(--term); color: var(--term-ink); padding: 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.55 ui-monospace, Menlo, monospace; }

  .talk { margin-top: 12px; display: grid; gap: 6px; }
  .said { padding: 8px 12px; border-radius: 12px 12px 12px 2px; background: var(--warn-soft); max-width: 85%; }
  .said.agent { background: var(--soft); border-radius: 12px 12px 2px 12px; justify-self: end; }
  .said b { font-size: 11.5px; display: block; color: var(--muted); } .said span { white-space: pre-wrap; }
  .since { margin-top: 14px; font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

  .act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  .act button { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 18px; font-weight: 600; }
  .act button.yes, .compose button, #go button { background: var(--good); border-color: var(--good); color: #fff; }
  .act .verdict { font-weight: 700; color: var(--good); font-size: 16px; }
  .act .undo { border: 0; background: none; color: var(--muted); font-weight: 500; padding: 10px 4px; text-decoration: underline; }
  .compose { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
  .compose textarea { flex: 1; min-height: 46px; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 11px; resize: vertical; }
  .compose textarea:focus { outline: none; border-color: var(--accent); }
  .compose button { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 600; }

  #whole-row { margin-top: 18px; }
  /* ---- go: progress and the next step, always in reach ---- */
  #go { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  #go .in { max-width: 960px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 14px; align-items: center; }
  #go svg { flex: none; } #go circle { fill: none; stroke-width: 5; } #go .bg { stroke: var(--line); } #go .fg { stroke: var(--good); stroke-linecap: round; transition: stroke-dasharray .4s; }
  #go .txt { flex: 1; min-width: 0; line-height: 1.3; } #go .txt b { display: block; } #go .txt span { color: var(--muted); font-size: 13px; }
  #go button { border: 0; border-radius: 12px; padding: 11px 26px; font-weight: 700; font-size: 16px; }
  #go button[disabled] { background: var(--idle); cursor: default; }
  @media (max-width: 640px) {
    :root { --jelly-comment-inset: auto 10px 90px auto; }
    #map { gap: 0 34px; } .node { padding: 8px 9px; font-size: 13px; gap: 7px; } .node .n { display: none; }
    .hero { grid-template-columns: 1fr; } .card { padding: 14px; } .card h2 { font-size: 19px; } .said { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p id="ask"></p>
  <div id="map"><svg id="wires"></svg><div class="col" id="outs"></div><div class="col" id="blocks"></div></div>
  <div id="lines"></div>
  <div id="stage"></div>
  <div id="whole-row"><details id="whole"><summary>The whole diff</summary><div id="whole-body"></div></details></div>
</div>
<div id="go"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATUS = { seen: "Seen working", tested: "Covered by a test", unverified: "Not verified" };
const MARK = { seen: "✓", tested: "✓", unverified: "?", approved: "✓", change: "↩", question: "?", open: "", mech: "" };
const KIND = { skipped: "Skipped", unverified: "Not verified", outside: "Outside your ask" };

// Changed lines in a unified diff: + and - lines, not the file headers.
const count = (diff, sign) => String(diff || "").split("\n").filter((l) => l[0] === sign && !/^(\+\+\+|---)( |$)/.test(l)).length;
const changed = (diff) => count(diff, "+") + count(diff, "-");
const diffHtml = (diff, id) => `<pre class="diff">${String(diff || "").replace(/\n$/, "").split("\n").map((l, i) => {
  const c = /^(\+\+\+|---) /.test(l) ? "f" : l[0] === "+" ? "a" : l[0] === "-" ? "d" : l.startsWith("@@") ? "h" : "";
  return `<span id="${id}-L${i + 1}"${c ? ` class="${c}"` : ""}>${esc(l) || " "}</span>`;
}).join("")}</pre>`;
const term = (text) => esc(text).split("\n").map((l) => (l.startsWith("$ ") ? `<span class="p">$</span>${l.slice(1)}` : l)).join("\n");
const who = (by) => (by === "person" ? "You" : by);
const st = (g) => g.verdict?.kind || (g.mechanical ? "mech" : "open");
const serves = (g) => [].concat(g.outcome || []); // one outcome id, or several
const asksAt = (g) => (jelly.itemsAt?.(`#g-${g.id}`) || []).filter((a) => !a.answer).length;

// What is only on this screen: what is on the stage, and which composer is open.
let sel = null;       // "g:<id>" or "o:<id>"
let composing = null; // { group, kind }
let wholeDiff = null; // text of assets/full.diff once loaded, false if there is none

// The picture of a change: before and after. Terminal text, images, or live HTML.
// `show` may be a list of pictures; `labels` renames the two sides, and
// `compare: "side"` puts two images next to each other instead of under a slider.
function hero(show, id) {
  if (Array.isArray(show)) return show.map((s, i) => hero(s, `${id}-${i + 1}`)).join("");
  if (!show) return "";
  const kind = show.kind || "terminal", [lb, la] = show.labels || ["before", "after"];
  if (kind === "image" && show.before && show.after && show.compare !== "side") {
    return `<div class="wipe" id="${id}-show"><img src="${esc(show.after)}" alt="after"><div class="b"><img src="${esc(show.before)}" alt="before"></div>
      <span class="tag l">${esc(lb)}</span><span class="tag r">${esc(la)}</span><input type="range" min="0" max="100" value="50" aria-label="Drag to compare before and after"></div>${show.caption ? `<div class="cap2">${esc(show.caption)}</div>` : ""}`;
  }
  const pane = (side, v) => v == null ? "" : `<div class="pane ${side}" id="${id}-${side}"><b>${esc(side === "before" ? lb : la)}</b>${
    kind === "html" ? `<iframe sandbox="allow-scripts" srcdoc="${esc(v)}" title="${side}"></iframe>` : kind === "image" ? `<img src="${esc(v)}" alt="${side}">` : `<pre>${term(v)}</pre>`}</div>`;
  const both = show.before != null && show.after != null;
  return `<div class="hero${both ? "" : " one"}">${pane("before", show.before)}${pane("after", show.after)}</div>${show.caption ? `<div class="cap2">${esc(show.caption)}</div>` : ""}`;
}

function groupCard(g, state, i, n) {
  const v = g.verdict, kind = st(g);
  const o = (state.outcomes || []).find((o) => serves(g).includes(o.id));
  const add = count(g.diff, "+"), del = count(g.diff, "-"), tot = add + del || 1;
  const boxes = Array.from({ length: 5 }, (_, k) => (k < Math.round((add / tot) * 5) ? "a" : "d")).map((c) => `<i class="${add + del ? c : ""}"></i>`).join("");
  const talk = [];
  if (g.last && g.last.kind !== "approved") talk.push(`<div class="said"><b>${esc(who(g.last.by))} ${g.last.kind === "question" ? "asked" : "pushed back"}</b><span>${esc(g.last.note)}</span></div>`);
  if (g.reply) talk.push(`<div class="said agent"><b>${esc(g.reply.by)}</b><span>${esc(g.reply.note)}</span></div>`);
  if (v && v.kind !== "approved") talk.push(`<div class="said"><b>${esc(who(v.by))} ${v.kind === "question" ? "asked" : "pushed back"} · waiting on the agent</b><span>${esc(v.note)}</span></div>`);
  const act = kind === "approved"
    ? `<span class="verdict">✓ Approved</span><button class="undo" data-do="take_back">Take back</button>`
    : `<button class="yes" data-do="approve">✓ Approve</button><button data-open="change">↩ Change this</button><button data-open="question">? Question</button>${v ? `<button class="undo" data-do="take_back">Take back</button>` : ""}`;
  const picture = g.delta ? `<div class="since">Changed since you looked</div>${diffHtml(g.delta, `g-${g.id}-delta`)}` : hero(g.show, `g-${g.id}`);
  return `<section class="card ${kind}" id="g-${esc(g.id)}" data-group="${esc(g.id)}">
    <div class="crumbs"><span>Change ${i + 1} of ${n}</span><span class="chip ${esc(g.risk)}">${esc(g.risk || "?")} risk</span>${g.mechanical ? `<span class="chip">mechanical</span>` : ""}${o ? `<span>for “${esc(o.text)}”</span>` : ""}
      <span class="nav"><button data-step="-1" aria-label="Previous change">‹</button><button data-step="1" aria-label="Next change">›</button></span></div>
    <h2>${esc(g.intent)}</h2>
    ${g.why ? `<p class="why">${esc(g.why)}</p>` : ""}
    ${talk.length ? `<div class="talk">${talk.join("")}</div>` : ""}
    ${picture}
    <div class="stat"><span class="boxes">${boxes}</span><span>+${add} −${del}</span><span>${(g.files || []).map(esc).join(" · ")}</span></div>
    <details id="g-${esc(g.id)}-diff"${picture ? "" : " open"}><summary>${g.delta ? "The full diff for this change" : "Diff"}</summary>${diffHtml(g.diff, `g-${g.id}`)}</details>
    ${g.evidence ? `<details id="g-${esc(g.id)}-ev"><summary>Evidence</summary><pre class="ev">${term(g.evidence)}</pre></details>` : ""}
    <div class="act">${act}</div>
    ${composing?.group === g.id ? `<div class="compose"><textarea id="g-${esc(g.id)}-note" aria-label="${composing.kind === "question" ? "Your question" : "What should change"}" placeholder="${composing.kind === "question" ? "What do you want to know?" : "What should change?"}"></textarea><button data-send="${composing.kind}">Send</button></div>` : ""}
  </section>`;
}

const outcomeCard = (o, state) => `<section class="card ${esc(o.status)}" id="o-${esc(o.id)}">
    <div class="crumbs"><span>You asked for</span><span class="chip">${STATUS[o.status] || esc(o.status)}</span></div>
    <h2>${esc(o.text)}</h2>
    ${o.evidence ? `<pre class="ev">${term(o.evidence)}</pre>` : `<p class="why">No evidence was given.</p>`}
    <div class="stat">${(state.groups || []).filter((g) => serves(g).includes(o.id)).map((g) => `<button class="chip" data-sel="g:${esc(g.id)}">${esc(g.intent)} ›</button>`).join("")}</div>
  </section>`;

function render(state) {
  const opened = new Set([...document.querySelectorAll("details[open]")].map((d) => d.id));
  const draft = document.querySelector(".compose textarea");
  const kept = draft && { id: draft.id, value: draft.value, focus: document.activeElement === draft };

  const groups = state.groups || [], outcomes = state.outcomes || [];
  const approved = (g) => g.verdict?.kind === "approved";
  // Start on what needs them: undecided first, then waiting on the agent.
  const firstOpen = groups.find((g) => !g.verdict && !g.mechanical) || groups.find((g) => !g.verdict) || groups.find((g) => !approved(g)) || groups[0];
  if (!sel || !(sel.startsWith("g:") ? groups : outcomes).some((x) => x.id === sel.slice(2))) sel = firstOpen ? `g:${firstOpen.id}` : null;

  $("title").textContent = state.title || "Review";
  $("ask").textContent = state.ask || "";

  $("outs").innerHTML = `<small>You asked for</small>` + outcomes.map((o) => `<button class="node ${esc(o.status)}${sel === `o:${o.id}` ? " on" : ""}" data-sel="o:${esc(o.id)}" data-node="o:${esc(o.id)}" title="${STATUS[o.status] || ""}">
      <span class="dot">${MARK[o.status] ?? ""}</span><span class="t">${esc(o.text)}</span></button>`).join("")
    + (state.not_done || []).filter((n) => n.kind !== "outside" || !/^none\b/i.test(n.text)).map((n, i) => `<div class="node gap ${esc(n.kind)}" id="nd-${i}" title="${KIND[n.kind] || ""}"><span class="dot">${n.kind === "outside" ? "!" : "–"}</span><span class="t"><b>${KIND[n.kind] || esc(n.kind)}.</b> ${esc(n.text)}</span></div>`).join("");
  $("blocks").innerHTML = `<small>What changed</small>` + groups.map((g) => { const q = asksAt(g); return `<button class="node ${st(g)}${sel === `g:${g.id}` ? " on" : ""}" data-sel="g:${esc(g.id)}" data-node="g:${esc(g.id)}" data-for="${esc(serves(g).join(" "))}" style="min-height:${Math.min(96, 44 + changed(g.diff) * 3)}px">
      <span class="dot">${MARK[st(g)]}</span><span class="t">${esc(g.intent)}</span>${q ? `<span class="q" title="The agent asks you something here">?</span>` : ""}<span class="n">${changed(g.diff)}</span></button>`; }).join("");

  // Every changed line should be in a change. Count against the whole diff when it is attached.
  const grouped = groups.reduce((n, g) => n + changed(g.diff), 0);
  const total = wholeDiff ? changed(wholeDiff) : state.total_lines;
  const lost = total == null ? 0 : total - grouped;
  $("lines").innerHTML = `<div class="bar" id="account">${groups.map((g) => `<i class="${st(g)}${sel === `g:${g.id}` ? " on" : ""}" data-sel="g:${esc(g.id)}" style="flex:${changed(g.diff) || 1}" title="${esc(g.intent)}: ${changed(g.diff)} lines"></i>`).join("")}${lost > 0 ? `<i class="lost" style="flex:${lost}" title="${lost} lines in no change"></i>` : ""}</div>
    <div class="cap"><span>${total ?? grouped} changed lines${state.range ? ` · ${esc(state.range)}` : ""}</span><span class="${lost ? "off" : ""}">${total == null ? "no total to check against" : lost > 0 ? `${lost} lines are in no change: open the whole diff` : lost < 0 ? `the changes hold ${-lost} lines more than the whole diff` : `every line is in a change${wholeDiff ? " ✓" : ""}`}</span></div>`;

  // Every change stays in the page so questions about it stay anchored; one shows.
  $("stage").innerHTML = groups.map((g, i) => `<div class="slide" data-slide="g:${esc(g.id)}"${sel === `g:${g.id}` ? "" : " hidden"}>${groupCard(g, state, i, groups.length)}</div>`).join("")
    + outcomes.filter((o) => sel === `o:${o.id}`).map((o) => `<div class="slide">${outcomeCard(o, state)}</div>`).join("");

  const done = groups.filter(approved).length, all = groups.length > 0 && done === groups.length;
  const asks = (jelly.attention || []).length, waiting = groups.length - done;
  const C = 2 * Math.PI * 16, part = groups.length ? done / groups.length : 0;
  const head = state.applied ? "Done" : state.go ? "You said go" : all ? "Everything is approved" : `${waiting} to go${asks ? ` · ${asks} question${asks === 1 ? "" : "s"}` : ""}`;
  const sub = state.applied ? state.applied.note : state.go ? `${state.next || ""}: the agent is on it` : `Then: ${state.next || ""}`;
  $("go").innerHTML = `<div class="in"><svg width="42" height="42" viewBox="0 0 42 42" role="img" aria-label="${done} of ${groups.length} approved"><circle class="bg" cx="21" cy="21" r="16"/><circle class="fg" cx="21" cy="21" r="16" transform="rotate(-90 21 21)" stroke-dasharray="${C * part} ${C}"/><text x="21" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">${done}/${groups.length}</text></svg>
    <div class="txt"><b>${esc(head)}</b><span>${esc(sub)}</span></div>${state.applied || state.go ? "" : `<button id="go-btn"${all ? "" : " disabled"}>Go</button>`}</div>`;

  for (const id of opened) { const d = $(id); if (d) d.open = true; }
  if (kept) { const t = $(kept.id); if (t) { t.value = kept.value; if (kept.focus) t.focus(); } }
  if ($("whole").open) showWhole(state);
  wire();
}

// Curves from each change to the outcome it is for.
function wire() {
  const map = $("map").getBoundingClientRect();
  $("wires").innerHTML = [...document.querySelectorAll("#blocks [data-for]")].flatMap((b) => b.dataset.for.split(" ").filter(Boolean).map((id) => {
    const o = document.querySelector(`#outs [data-node="${CSS.escape("o:" + id)}"]`);
    if (!o) return "";
    const p = o.getBoundingClientRect(), q = b.getBoundingClientRect();
    const x1 = p.right - map.left, y1 = p.top + p.height / 2 - map.top, x2 = q.left - map.left, y2 = q.top + q.height / 2 - map.top, m = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" stroke="${getComputedStyle(b).getPropertyValue("--c")}"/>`;
  })).join("");
}
new ResizeObserver(wire).observe($("map"));

function showWhole(state) {
  $("whole-body").innerHTML = wholeDiff ? diffHtml(wholeDiff, "whole")
    : `<p class="why">The agent did not attach the whole diff. This is every change's diff, one after the other.</p>${diffHtml((state.groups || []).map((g) => g.diff).join("\n"), "whole")}`;
}
$("whole").addEventListener("toggle", () => $("whole").open && showWhole(jelly.state));

const fail = (e) => alert(e.message);
const step = (d) => {
  const ids = (jelly.state.groups || []).map((g) => `g:${g.id}`), i = ids.indexOf(sel);
  if (ids.length) { sel = ids[(Math.max(i, 0) + d + ids.length) % ids.length]; composing = null; render(jelly.state); }
};
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-sel]");
  if (!b) return;
  if (b.dataset.sel) { sel = b.dataset.sel; composing = null; render(jelly.state); return $("stage").scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  if (b.dataset.step) return step(+b.dataset.step);
  if (b.id === "go-btn") return jelly.call("go").catch(fail);
  const group = b.closest("[data-group]")?.dataset.group;
  if (!group) return;
  if (b.dataset.do) {
    composing = null;
    // Approving moves on to the next change that still needs them.
    return jelly.call(b.dataset.do, { group }).then(() => { if (b.dataset.do === "approve") { sel = null; render(jelly.state); } }, fail);
  }
  if (b.dataset.open) {
    composing = composing?.group === group && composing.kind === b.dataset.open ? null : { group, kind: b.dataset.open };
    render(jelly.state);
    return $(`g-${group}-note`)?.focus();
  }
  if (b.dataset.send) {
    return jelly.call(b.dataset.send === "question" ? "question" : "push_back", { group, note: $(`g-${group}-note`).value }).then(() => { composing = null; render(jelly.state); }, fail);
  }
});
document.addEventListener("input", (e) => { if (e.target.matches(".wipe input")) e.target.parentElement.style.setProperty("--w", e.target.value + "%"); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("textarea, input")) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.matches(".compose textarea")) { e.preventDefault(); e.target.nextElementSibling.click(); }
    return;
  }
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});

// The project's DESIGN.md tokens, when this is served by the daemon.
if (location.protocol.startsWith("http") && jelly.name.includes(":")) {
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = `/p/${encodeURIComponent(jelly.name.split(":")[0])}/design.css`;
  l.onerror = () => l.remove();
  document.head.appendChild(l);
}
jelly.onState(render);
jelly.onAttention?.(() => render(jelly.state));
// The whole diff is an asset, outside state: `jelly asset review full.diff`.
fetch("assets/full.diff").then((r) => (r.ok ? r.text() : null), () => null).then((t) => { wholeDiff = t || false; render(jelly.state); });
</script>
</body>
</html>
