<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>timeline</title>
<style>
  /* Plain on purpose. With a DESIGN.md in the project its tokens take over. */
  :root {
    --bg: #fbfaf8; --card: #fff; --ink: #1f1a1d; --ink-2: #4c4449; --muted: #857b81; --line: #e8e2e4; --soft: #f4f0f1;
    --accent: var(--color-primary, #c8255d); --r: var(--rounded-md, 14px);
    --good: #2f9a4c; --good-soft: #e3f3e6; --warn: #c98a00; --warn-soft: #fff1c7; --bad: #c9392f; --bad-soft: #fde7e4; --idle: #b9b0b5;
    --term: #17141c; --term-ink: #e9e4ee;
    color-scheme: light;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #15131a; --card: #1e1b25; --ink: #f1ecf4; --ink-2: #d2c9d8; --muted: #a096aa; --line: #322c3d; --soft: #262130;
    --good: #5fcf80; --good-soft: #1d3324; --warn: #ffcf3f; --warn-soft: #3a3014; --bad: #ff7a70; --bad-soft: #3d1f1d; --idle: #5a5266;
    --term: #0d0b11;
    color-scheme: dark;
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 20px 80px; }
  h1 { font-size: 24px; line-height: 1.2; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  #question { margin: 4px 0 0; color: var(--ink-2); }
  #status { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  #conclusion { margin-top: 14px; padding: 12px 16px; border-radius: var(--r); background: var(--good-soft); border-left: 5px solid var(--good); }
  #conclusion b { display: block; font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--good); }

  #main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; margin-top: 16px; align-items: start; }
  #left { min-width: 0; }

  /* ---- the axis ---- */
  #tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #tools button { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 5px 11px; font-weight: 600; font-size: 13.5px; min-width: 34px; }
  #tools button[disabled] { opacity: .4; cursor: default; }
  #tools .lead { margin-left: auto; }
  #legend { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  /* Inline-blocks all the way up to #axis: jelly lifts a question asked about a
     mark out of inline boxes, so it lands below the plot instead of inside the SVG. */
  #plot { display: inline-block; width: 100%; vertical-align: top; position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
  #plot.drag { cursor: grabbing; }
  #plot svg { display: inline-block; vertical-align: top; width: 100%; }
  svg text { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
  svg .band { fill: transparent; } svg .band.alt { fill: var(--soft); opacity: .55; }
  svg .lane { font: 600 10.5px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }
  svg .tick { stroke: var(--line); stroke-width: 1; } svg .tickl { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  svg .gap { stroke: var(--idle); stroke-width: 1.5; stroke-dasharray: 3 4; } svg .gapl { font-size: 11px; fill: var(--muted); text-anchor: middle; }
  svg .gapbg { fill: var(--bg); opacity: .8; }
  .mark { cursor: pointer; outline: none; }
  .mark .hit { fill: transparent; }
  .mark .body { fill: var(--ink-2); stroke: var(--card); stroke-width: 1.5; }
  .mark.k-bad .body { fill: var(--ink); } .mark.k-ok .body { fill: var(--card); stroke: var(--ink-2); stroke-width: 2; } .mark.k-info .body { fill: var(--idle); }
  .mark .glyph { font: 700 10px -apple-system, sans-serif; fill: var(--card); text-anchor: middle; pointer-events: none; }
  .mark.k-ok .glyph { fill: var(--ink-2); }
  .mark.person .body { stroke-dasharray: 3 2; stroke: var(--accent); }
  .mark .lbl { fill: var(--ink-2); } .mark.k-bad .lbl { fill: var(--ink); font-weight: 600; }
  .mark .star { fill: var(--accent); font-size: 12px; text-anchor: middle; }
  .mark .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
  .mark.sel .ring, .mark:focus-visible .ring { opacity: 1; }
  .mark.sel .lbl { fill: var(--ink); font-weight: 700; }
  .lit .mark { opacity: .22; } .lit .mark.sup, .lit .mark.con, .lit .mark.sel { opacity: 1; }
  .mark.sup .body { fill: var(--good); stroke: var(--good); } .mark.con .body { fill: var(--bad); stroke: var(--bad); }
  .mark.sup .glyph, .mark.con .glyph { fill: #fff; }
  .mark.new .body { animation: arrive 2.4s ease-out; }
  @keyframes arrive { 0%, 40% { stroke: var(--accent); stroke-width: 9; } 100% { stroke-width: 1.5; } }
  #toast { position: absolute; right: 10px; top: 8px; z-index: 3; border: 0; border-radius: 99px; padding: 5px 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; box-shadow: 0 6px 18px -6px rgba(0,0,0,.4); }

  /* ---- what one mark is: the evidence itself ---- */
  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  #detail { margin-top: 14px; border-top: 5px solid var(--ink-2); }
  .crumbs { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .crumbs .nav { margin-left: auto; display: flex; gap: 6px; }
  .crumbs .nav button { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); font-size: 16px; line-height: 1; }
  .chip { all: unset; box-sizing: border-box; font: 600 11.5px -apple-system, sans-serif; padding: 2px 9px; border-radius: 99px; background: var(--soft); color: var(--ink-2); }
  button.chip { cursor: pointer; } .chip.sup { background: var(--good-soft); color: var(--ink); } .chip.con { background: var(--bad-soft); color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--bg); }
  #detail h2 { margin: 8px 0 0; font-size: 20px; line-height: 1.25; letter-spacing: -.01em; }
  .why { margin: 4px 0 0; color: var(--ink-2); }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; } .hero.one { grid-template-columns: 1fr; }
  .pane { min-width: 0; border-radius: 10px; overflow: hidden; border: 2px solid var(--idle); background: var(--term); }
  .pane.after { border-color: var(--ink-2); }
  .hero:not(.one) .pane.after { border-color: var(--good); }
  .pane > b { display: block; font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; background: var(--idle); color: #fff; }
  .hero.one .pane > b { display: none; } .hero:not(.one) .pane.after > b { background: var(--good); }
  .pane pre { margin: 0; padding: 12px; color: var(--term-ink); white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.55 ui-monospace, Menlo, monospace; max-height: 340px; overflow-y: auto; }
  .pane pre .p { opacity: .55; }
  .pane iframe { display: block; width: 100%; height: 260px; border: 0; background: #fff; } .pane img { display: block; width: 100%; }
  .cap2 { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .act button { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .act button.on { border-color: var(--accent); color: var(--accent); }
  .act .undo { border: 0; background: none; color: var(--muted); font-weight: 500; padding: 8px 4px; text-decoration: underline; }

  /* ---- the explanations ---- */
  #hyps > small, #know > small { display: block; font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .hyp { background: var(--card); border: 1.5px solid var(--line); border-left: 6px solid var(--idle); border-radius: var(--r); margin-bottom: 10px; scroll-margin-top: 12px; }
  .hyp.on { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 14%, transparent); }
  .hyp.v-confirmed { border-left-color: var(--good); } .hyp.v-ruled_out { border-left-color: var(--bad); } .hyp.v-next { border-left-color: var(--warn); }
  .hyp .hd { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 12px 14px 10px; }
  .hyp .t { font-weight: 650; line-height: 1.3; display: block; } .hyp.v-ruled_out .t { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--ink-2); }
  .conf { height: 8px; border-radius: 4px; background: var(--soft); margin-top: 9px; overflow: hidden; } .conf i { display: block; height: 100%; background: var(--ink-2); border-radius: 4px; transition: width .5s; }
  .hyp .meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .hyp .meta .for { color: var(--good); font-weight: 600; } .hyp .meta .against { color: var(--bad); font-weight: 600; }
  .badge { font: 700 11.5px -apple-system, sans-serif; padding: 2px 9px; border-radius: 99px; color: #fff; background: var(--idle); }
  .badge.confirmed { background: var(--good); } .badge.ruled_out { background: var(--bad); } .badge.next { background: var(--warn); color: #1f1a1d; }
  .hyp .q { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 12px -apple-system, sans-serif; display: inline-grid; place-items: center; }
  .hyp .more { padding: 0 14px 14px; }
  .hyp .more p { margin: 0 0 8px; color: var(--ink-2); font-size: 14px; }
  .hyp .more p b { display: block; font: 600 10.5px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hyp .said { padding: 7px 11px; border-radius: 12px 12px 12px 2px; background: var(--warn-soft); margin-bottom: 8px; font-size: 14px; }
  .hyp .act { margin-top: 10px; gap: 6px; } .hyp .act button { padding: 7px 11px; font-size: 13.5px; }
  .hyp .act button.confirmed.on { background: var(--good); border-color: var(--good); color: #fff; }
  .hyp .act button.ruled_out.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .hyp .act button.next.on { background: var(--warn); border-color: var(--warn); color: #1f1a1d; }
  .compose { display: flex; gap: 8px; margin-top: 8px; align-items: flex-end; }
  textarea { flex: 1; width: 100%; min-height: 44px; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; resize: vertical; }
  textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .send { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; background: var(--ink); color: var(--bg); }

  /* ---- something the person knows ---- */
  #know { margin-top: 16px; }
  #know .open { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; text-align: center; padding: 11px; border: 1.5px dashed var(--idle); border-radius: var(--r); font-weight: 600; color: var(--ink-2); }
  #know .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 9px; }
  #know .row > span { font-size: 12.5px; color: var(--muted); min-width: 44px; }
  #know select { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 5px 8px; max-width: 100%; flex: 1; min-width: 0; }
  #know button.chip { padding: 5px 11px; font-size: 13px; }

  @media (max-width: 900px) {
    #main { grid-template-columns: minmax(0, 1fr); }
    .hero { grid-template-columns: 1fr; } .card { padding: 14px; } h1 { font-size: 22px; }
    #tools .lead { margin-left: 0; width: 100%; order: 3; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p id="question"></p>
  <p id="status"></p>
  <div id="conclusion" hidden></div>
  <div id="main">
    <div id="left">
      <div id="tools">
        <button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit">Fit all</button>
        <span id="legend" class="lead"></span>
      </div>
      <div id="axis"><span id="plot"><svg id="svg" role="group" aria-label="Timeline"></svg></span></div>
      <section class="card" id="detail"></section>
    </div>
    <div id="right">
      <div id="hyps"></div>
      <div id="know"></div>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const term = (text) => esc(text).split("\n").map((l) => (l.startsWith("$ ") ? `<span class="p">$</span>${l.slice(1)}` : l)).join("\n");
const who = (by) => (by === "person" ? "You" : by);
const VERDICT = { confirmed: "✓ Confirmed", ruled_out: "✕ Ruled out", next: "→ Check this next" };
const GLYPH = { ok: "✓", bad: "×", info: "" };

// What is only on this screen: where the axis is looking, and what is picked.
let zoom = 1, centre = null;   // zoom 1 fits everything; centre is the time in the middle
let selMark, selHyp = null;    // ids
let noting = null;             // hypothesis whose note is being written
let knowing = null;            // { lane, rel, mark, kind } while adding what they know
let seen = null, arrived = new Set(), toast = null; // marks that came in while the page was open
let geo = null;                // the last layout, for zoom, pan and hit tests

const marksOf = (s) => [...(s.marks || [])].sort((a, b) => a.t - b.t || String(a.id).localeCompare(b.id));
const hypsWith = (s, id) => ({ sup: (s.hypotheses || []).filter((h) => (h.supports || []).includes(id)), con: (s.hypotheses || []).filter((h) => (h.contradicts || []).includes(id)) });

// ---- time ----
// Long quiet stretches are cut out of the axis, so two busy minutes hours apart
// both stay readable. `u` is the axis unit: seconds, minus what was cut.
function scaleOf(marks) {
  const ext = marks.map((m) => [m.t, m.t + (m.dur || 0)]).sort((a, b) => a[0] - b[0]);
  if (!ext.length) return { total: 1, segs: [], toU: () => 0, fromU: () => 0, kmax: 1 };
  const lo = ext[0][0], hi = Math.max(...ext.map((e) => e[1])), span = Math.max(hi - lo, 1e-6);
  const gaps = []; let end = ext[0][1];
  for (const e of ext.slice(1)) { if (e[0] > end) gaps.push(e[0] - end); end = Math.max(end, e[1]); }
  gaps.sort((a, b) => a - b);
  const median = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 0;
  const cut = gaps.length >= 4 ? Math.max(median * 6, span * 0.05) : span * 0.25;
  const raw = []; let cur = [...ext[0]];
  for (const e of ext.slice(1)) { if (e[0] - cur[1] > cut) { raw.push(cur); cur = [...e]; } else cur[1] = Math.max(cur[1], e[1]); }
  raw.push(cur);
  const len = raw.reduce((n, s) => n + (s[1] - s[0]), 0) || 1;
  const pad = len * 0.04, gapU = raw.length > 1 ? len * 0.07 : 0;
  // A short busy stretch still gets a fair share of the width: `k` stretches it.
  const least = raw.length > 1 ? (len / raw.length) * 0.6 : 0;
  let u = 0;
  const segs = raw.map(([a, b], i) => {
    const s = { a: a - pad, b: b + pad, u }, own = s.b - s.a;
    s.len = Math.max(own, least); s.k = s.len / own;
    u += s.len + (i < raw.length - 1 ? gapU : 0);
    return s;
  });
  const toU = (t) => {
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i], next = segs[i + 1];
      if (t <= s.b || !next) return s.u + (Math.max(t, s.a) - s.a) * s.k;
      if (t < next.a) return s.u + s.len + gapU * ((t - s.b) / (next.a - s.b));
    }
    return 0;
  };
  const fromU = (v) => {
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i], next = segs[i + 1];
      if (v <= s.u + s.len || !next) return s.a + (v - s.u) / s.k;
      if (v < next.u) return s.b + (next.a - s.b) * ((v - s.u - s.len) / gapU);
    }
    return 0;
  };
  return { total: u, segs, toU, fromU, kmax: Math.max(...segs.map((s) => s.k)) };
}
const two = (n) => String(Math.floor(n)).padStart(2, "0");
function clock(state, t, secs) {
  const m = /^(\d+):(\d+)/.exec(state.clock || "");
  if (!m) { const s = Math.round(t); return `${s < 0 ? "−" : "+"}${Math.floor(Math.abs(s) / 60)}:${two(Math.abs(s) % 60)}`; }
  const total = ((+m[1] * 3600 + +m[2] * 60 + Math.round(t)) % 86400 + 86400) % 86400;
  return `${two(total / 3600)}:${two((total % 3600) / 60)}${secs ? ":" + two(total % 60) : ""}`;
}
const dur = (d) => d == null ? "" : d < 1 ? `${Math.round(d * 1000)} ms` : d < 90 ? `${+d.toFixed(d < 10 ? 1 : 0)} s` : d < 5400 ? `${Math.round(d / 60)} min` : `${Math.floor(d / 3600)} h ${Math.round((d % 3600) / 60)} min`;
const whenOf = (state, m) => m.when || `${m.approx ? "about " : ""}${clock(state, m.t)}`;

// ---- the axis ----
const ROW = 26, HEAD = 22, TOP = 26, PADX = 14;
function drawAxis(state) {
  const marks = marksOf(state), lanes = state.lanes || [];
  const W = Math.max($("plot").clientWidth, 200), small = W < 560;
  const sc = scaleOf(marks), inner = W - PADX * 2;
  const fit = inner / sc.total, px = fit * zoom;
  const half = inner / px / 2;
  const mid = Math.min(Math.max(centre == null ? sc.total / 2 : sc.toU(centre), half), Math.max(sc.total - half, half));
  centre = zoom > 1.001 ? sc.fromU(mid) : null;   // a time, so marks that arrive do not move the view
  const u0 = mid - half, X = (t) => PADX + (sc.toU(t) - u0) * px;
  const h = (state.hypotheses || []).find((h) => h.id === selHyp);
  const clip = small ? 18 : 26, CH = 6.5;

  // Each lane stacks its marks into rows so labels do not run into each other.
  let y = TOP;
  const out = [], bands = [], names = [], placed = {};
  lanes.forEach((lane, li) => {
    const mine = marks.filter((m) => m.lane === lane.id);
    const rows = [];
    for (const m of mine) {
      const x = X(m.t), w = Math.max(14, X(m.t + (m.dur || 0)) - x);
      let text = m.label.length > clip ? m.label.slice(0, clip - 1).trimEnd() + "…" : m.label;
      let lw = text.length * CH + 8, left = false, r;
      if (x + w + lw > W - 4) {   // no room on the right: the label goes to the left of its mark, or gets shorter
        r = rows.findIndex((right) => x - lw >= Math.max(right + 10, 4));
        if (r < 0 && rows.length < 10 && x - lw >= 4) r = rows.length;
        if (r >= 0) left = true;
        else { const n = Math.floor((W - 6 - x - w - 8) / CH); text = n >= 6 ? m.label.slice(0, n - 1).trimEnd() + "…" : ""; lw = text ? text.length * CH + 8 : 0; }
      }
      if (r == null || r < 0) r = rows.findIndex((right) => x >= right + 10);
      if (r < 0 && rows.length < 10) r = rows.length;
      if (r < 0) { r = rows.indexOf(Math.min(...rows)); lw = 0; text = ""; }   // no row left: the mark without its label
      rows[r] = Math.max(rows[r] ?? -1e9, x + w + (left ? 0 : lw));
      placed[m.id] = { x, w, r, text, lw, left };
    }
    const hgt = HEAD + Math.max(rows.length, 1) * ROW + 6;
    bands.push(`<rect class="band${li % 2 ? " alt" : ""}" x="0" y="${y}" width="${W}" height="${hgt}"/>`);
    names.push(`<text class="lane" x="${PADX}" y="${y + 15}">${esc(lane.label)}</text>`);
    for (const m of mine) {
      const p = placed[m.id], cy = y + HEAD + p.r * ROW + ROW / 2;
      p.cy = cy;
      const side = h ? ((h.supports || []).includes(m.id) ? " sup" : (h.contradicts || []).includes(m.id) ? " con" : "") : "";
      const cls = `mark k-${GLYPH[m.kind] != null ? m.kind : "info"}${side}${m.id === selMark ? " sel" : ""}${m.by === "person" ? " person" : ""}${arrived.has(m.id) ? " new" : ""}`;
      out.push(`<g class="${cls}" id="e-${esc(m.id)}" data-mark="${esc(m.id)}" transform="translate(${p.x.toFixed(1)},${cy})" tabindex="0" role="button" aria-label="${esc(m.label)}, ${esc(whenOf(state, m))}">
        <title>${esc(m.label)} · ${esc(whenOf(state, m))}</title>
        <rect class="hit" x="${p.left ? -p.lw - 4 : -4}" y="${-ROW / 2}" width="${p.w + p.lw + 8}" height="${ROW}"/>
        <rect class="ring" x="-4" y="-11" width="${p.w + 8}" height="22" rx="11"/>
        <rect class="body" x="0" y="-7" width="${p.w.toFixed(1)}" height="14" rx="7"/>
        <text class="glyph" x="7" y="3.5">${side ? (side === " sup" ? "+" : "−") : GLYPH[m.kind] || ""}</text>
        ${m.pinned ? `<text class="star" x="${p.w - 1}" y="-8">★</text>` : ""}
        ${p.text ? `<text class="lbl" x="${p.left ? -6 : p.w + 6}" y="4"${p.left ? ` text-anchor="end"` : ""}>${esc(p.text)}</text>` : ""}</g>`);
    }
    y += hgt;
  });
  const H = y + (sc.segs.length > 1 ? 22 : 6);   // room at the bottom to say how much time was cut

  // Ticks inside each stretch, and a mark where time was cut.
  const steps = [0.001, 0.01, 0.1, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 21600, 86400];
  const base = /^(\d+):(\d+)/.exec(state.clock || ""), off = base ? +base[1] * 3600 + +base[2] * 60 : 0;
  const ticks = [];
  const tick = (t, x, secs) => `<line class="tick" x1="${x.toFixed(1)}" y1="${TOP - 4}" x2="${x.toFixed(1)}" y2="${y}"/><text class="tickl" x="${(x + 3).toFixed(1)}" y="15">${clock(state, t, secs)}</text>`;
  sc.segs.forEach((s, i) => {
    const step = steps.find((st) => st * px * s.k >= (small ? 58 : 84)) || 86400;
    let drawn = 0;
    for (let k = Math.ceil((s.a + off) / step); k * step - off <= s.b; k++) {
      const t = k * step - off, x = X(t);
      if (x < 4 || x > W - 40 || x > X(s.b) - 34) continue;
      drawn++;
      ticks.push(tick(t, x, step < 60));
    }
    // A stretch too short for a round tick still says what time it is.
    const first = marks.find((m) => m.t >= s.a && m.t <= s.b);
    if (!drawn && first && X(first.t) > 4 && X(first.t) < W - 40) ticks.push(tick(first.t, X(first.t), false));
    const next = sc.segs[i + 1];
    if (next) {
      const x1 = X(s.b), x2 = X(next.a), mid = (x1 + x2) / 2;
      ticks.push(`<rect class="gapbg" x="${x1.toFixed(1)}" y="0" width="${Math.max(x2 - x1, 0).toFixed(1)}" height="${H}"/><line class="gap" x1="${mid.toFixed(1)}" y1="4" x2="${mid.toFixed(1)}" y2="${y + 4}"/><text class="gapl" x="${Math.min(Math.max(mid, 50), W - 50).toFixed(1)}" y="${y + 17}">${dur(next.a - s.b)} later</text>`);
    }
  });

  const svg = $("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  svg.setAttribute("class", h ? "lit" : "");
  svg.innerHTML = bands.join("") + ticks.join("") + names.join("") + out.join("");
  geo = { W, px, fit, sc, u0, mid, inner, placed };

  $("zoom-out").disabled = zoom <= 1.001; $("fit").disabled = zoom <= 1.001;
  $("legend").innerHTML = h ? `<span><i style="background:var(--good)"></i>for</span><span><i style="background:var(--bad)"></i>against</span><span>the rest is dimmed</span>`
    : `<span>${marks.length} thing${marks.length === 1 ? "" : "s"} seen${sc.segs.length > 1 ? ` · quiet stretches cut` : ""}${zoom > 1.001 ? " · drag to move" : ""}</span>`;
  let t = $("toast");
  if (toast) {
    if (!t) { t = document.createElement("button"); t.id = "toast"; $("plot").appendChild(t); }
    t.textContent = toast.n === 1 ? `New: ${toast.label}` : `${toast.n} new`; t.dataset.mark = toast.id;
  } else t?.remove();
}

// ---- one mark, with the evidence itself ----
function hero(show, id) {
  if (Array.isArray(show)) return show.map((s, i) => hero(s, `${id}-${i + 1}`)).join("");
  if (!show) return "";
  const kind = show.kind || "terminal", [lb, la] = show.labels || ["before", "after"];
  const pane = (side, v) => v == null ? "" : `<div class="pane ${side}" id="${id}-${side}"><b>${esc(side === "before" ? lb : la)}</b>${
    kind === "html" ? `<iframe sandbox="allow-scripts" srcdoc="${esc(v)}" title="${side}"></iframe>` : kind === "image" ? `<img src="${esc(v)}" alt="${side}">` : `<pre>${term(v)}</pre>`}</div>`;
  const both = show.before != null && show.after != null;
  return `<div class="hero${both ? "" : " one"}">${pane("before", show.before)}${pane("after", show.after)}</div>${show.caption ? `<div class="cap2">${esc(show.caption)}</div>` : ""}`;
}
function drawDetail(state) {
  const marks = marksOf(state), m = marks.find((m) => m.id === selMark);
  if (!m) { $("detail").innerHTML = `<p class="why">Nothing has been seen yet.</p>`; return; }
  const i = marks.indexOf(m), lane = (state.lanes || []).find((l) => l.id === m.lane), { sup, con } = hypsWith(state, m.id);
  $("detail").innerHTML = `<div class="crumbs"><span>${i + 1} of ${marks.length}</span><span class="chip">${esc(lane?.label || m.lane)}</span><span>${esc(whenOf(state, m))}${m.dur ? ` · took ${dur(m.dur)}` : ""}</span>${m.by === "person" ? `<span class="chip">you added this</span>` : ""}
      <span class="nav"><button data-step="-1" aria-label="Earlier">‹</button><button data-step="1" aria-label="Later">›</button></span></div>
    <h2>${esc(m.label)}</h2>
    ${m.detail ? `<p class="why">${esc(m.detail)}</p>` : ""}
    ${hero(m.show, `e-${m.id}-show`)}
    ${sup.length + con.length ? `<div class="links">${sup.map((h) => `<button class="chip sup" data-hyp="${esc(h.id)}">+ for: ${esc(h.text)}</button>`).join("")}${con.map((h) => `<button class="chip con" data-hyp="${esc(h.id)}">− against: ${esc(h.text)}</button>`).join("")}</div>` : ""}
    <div class="act"><button data-pin class="${m.pinned ? "on" : ""}">${m.pinned ? `★ This matters${m.pinned.by === "person" ? "" : ` (${esc(m.pinned.by)})`}` : "☆ This matters"}</button>${m.pinned ? `<button class="undo" data-unpin>Unpin</button>` : ""}</div>`;
}

// ---- the explanations ----
function drawHyps(state) {
  const hs = state.hypotheses || [], byId = Object.fromEntries((state.marks || []).map((m) => [m.id, m]));
  $("hyps").innerHTML = `<small>What could explain it</small>` + (hs.length ? "" : `<p class="why">No explanation yet.</p>`) + hs.map((h) => {
    const on = h.id === selHyp, v = h.verdict, asks = (jelly.itemsAt?.(`#h-${h.id}`) || []).filter((a) => !a.answer).length;
    const chips = (ids, c) => (ids || []).filter((id) => byId[id]).map((id) => `<button class="chip ${c}${id === selMark ? " on" : ""}" data-mark="${esc(id)}">${c === "sup" ? "+" : "−"} ${esc(byId[id].label)}</button>`).join("");
    return `<section class="hyp${on ? " on" : ""}${v ? ` v-${v.kind}` : ""}" id="h-${esc(h.id)}" data-hyp-card="${esc(h.id)}">
      <button class="hd" data-hyp="${esc(h.id)}" aria-expanded="${on}"><span class="t">${esc(h.text)}</span>
        <div class="conf" title="${esc(h.by || "agent")}'s confidence"><i style="width:${Math.max(0, Math.min(100, h.confidence || 0))}%"></i></div>
        <div class="meta"><span>${esc(h.by || "agent")}: ${h.confidence ?? "?"}%${h.was != null ? ` (was ${h.was}%)` : ""}</span><span class="for">${(h.supports || []).length} for</span><span class="against">${(h.contradicts || []).length} against</span>${asks ? `<span class="q" title="The agent asks you something here">?</span>` : ""}${v ? `<span class="badge ${v.kind}">${esc(who(v.by))}: ${VERDICT[v.kind].slice(2).toLowerCase()}</span>` : ""}</div></button>
      ${on ? `<div class="more">
        ${h.why ? `<p><b>Why ${h.confidence ?? "?"}%</b>${esc(h.why)}</p>` : ""}
        ${h.settle ? `<p><b>What would settle it</b>${esc(h.settle)}</p>` : ""}
        <div class="links" style="margin-top:0">${chips(h.supports, "sup")}${chips(h.contradicts, "con")}</div>
        ${v?.note ? `<div class="said" style="margin-top:10px">${esc(who(v.by))}: ${esc(v.note)}</div>` : ""}
        <div class="act">${Object.keys(VERDICT).map((k) => `<button class="${k}${v?.kind === k ? " on" : ""}" data-verdict="${k}">${VERDICT[k]}</button>`).join("")}</div>
        <div class="act" style="margin-top:6px">${v ? `<button class="undo" data-note>${v.note ? "Change the note" : "Add a note"}</button><button class="undo" data-takeback>Take back</button>` : ""}</div>
        ${noting === h.id && v ? `<div class="compose"><textarea id="h-${esc(h.id)}-note" aria-label="A note on your verdict" placeholder="Why, or what to check">${esc(v.note || "")}</textarea><button class="send" data-savenote>Save</button></div>` : ""}
      </div>` : ""}
    </section>`;
  }).join("");
}

// ---- something the person knows: choices first, then a few words ----
function drawKnow(state) {
  const marks = marksOf(state), lanes = state.lanes || [];
  if (!knowing || !marks.length || !lanes.length) { $("know").innerHTML = marks.length && lanes.length ? `<button class="open" data-know>＋ Add something you know</button>` : ""; return; }
  const k = knowing, chip = (key, val, text) => `<button class="chip${k[key] === val ? " on" : ""}" data-k="${key}" data-v="${esc(val)}">${esc(text)}</button>`;
  $("know").innerHTML = `<small>Something you know</small><div class="card">
    <div class="row"><span>It was</span>${chip("kind", "bad", "× a failure")}${chip("kind", "ok", "✓ it working")}${chip("kind", "info", "something else")}</div>
    <div class="row"><span>Where</span>${lanes.map((l) => chip("lane", l.id, l.label)).join("")}</div>
    <div class="row"><span>When</span>${chip("rel", "before", "before")}${chip("rel", "with", "same time as")}${chip("rel", "after", "after")}</div>
    <div class="row"><select id="know-mark" aria-label="The mark it was next to">${marks.map((m) => `<option value="${esc(m.id)}"${m.id === k.mark ? " selected" : ""}>${esc(whenOf(state, m))} · ${esc(m.label)}</option>`).join("")}</select></div>
    <div class="compose" style="margin-top:0"><textarea id="know-text" aria-label="What happened" placeholder="What happened, in a few words"></textarea><button class="send" data-addknow>Add</button></div>
    <div class="act" style="margin-top:4px"><button class="undo" data-know-cancel>Cancel</button></div></div>`;
}

function render(state) {
  // Keep what is half-typed and what is open across a redraw.
  const drafts = [...document.querySelectorAll("textarea")].map((t) => ({ id: t.id, value: t.value, focus: document.activeElement === t, at: t.selectionStart }));
  const marks = marksOf(state);
  // Marks that arrive while the page is open are shown arriving.
  const ids = new Set(marks.map((m) => m.id));
  if (seen) {
    const fresh = marks.filter((m) => !seen.has(m.id));
    if (fresh.length) {
      fresh.forEach((m) => arrived.add(m.id));
      toast = { n: (toast?.n || 0) + fresh.length, id: fresh.at(-1).id, label: fresh.at(-1).label };
      setTimeout(() => { fresh.forEach((m) => arrived.delete(m.id)); }, 2600);
      clearTimeout(render.t); render.t = setTimeout(() => { toast = null; drawAxis(jelly.state); }, 9000);
    }
  }
  seen = ids;
  if (!ids.has(selMark)) selMark = (marks.find((m) => m.pinned) || marks[0])?.id;
  if (selHyp && !(state.hypotheses || []).some((h) => h.id === selHyp)) selHyp = null;

  $("title").textContent = state.title || "Timeline";
  $("question").textContent = state.question || "";
  $("status").textContent = state.status || "";
  const c = state.conclusion, ch = c && (state.hypotheses || []).find((h) => h.id === c.hypothesis);
  $("conclusion").hidden = !c;
  $("conclusion").innerHTML = c ? `<b>What it turned out to be · ${esc(c.by)}</b>${esc(c.text)}${ch ? ` <button class="chip" data-hyp="${esc(ch.id)}">${esc(ch.text)} ›</button>` : ""}` : "";

  drawAxis(state); drawDetail(state); drawHyps(state); drawKnow(state);
  for (const d of drafts) { const t = d.id && $(d.id); if (t) { t.value = d.value; if (d.focus) { t.focus(); t.setSelectionRange(d.at, d.at); } } }
}

// ---- moving around ----
const fail = (e) => alert(e.message);
function show(id, bring) {
  selMark = id;
  if (bring && geo) {  // bring it into view when zoomed in
    const m = (jelly.state.marks || []).find((m) => m.id === id);
    if (m && Math.abs(geo.sc.toU(m.t) - geo.mid) > (geo.inner / geo.px / 2) * 0.9) centre = m.t;
  }
  render(jelly.state);
}
function zoomBy(f, atX) {
  if (!geo) return;
  // Zoom about the pointer, else about the picked mark when it is in view, else about the middle.
  const m = (jelly.state.marks || []).find((m) => m.id === selMark), mu = m ? geo.sc.toU(m.t) : geo.mid;
  const u = atX != null ? geo.u0 + (atX - PADX) / geo.px : Math.abs(mu - geo.mid) * geo.px < geo.inner / 2 ? mu : geo.mid;
  const z = Math.min(Math.max(zoom * f, 1), Math.max(1, 60 / (geo.fit * geo.sc.kmax)));   // never past 60 px a second
  centre = geo.sc.fromU(u + (geo.mid - u) * (zoom / z)); zoom = z;
  drawAxis(jelly.state);
}
$("zoom-in").onclick = () => zoomBy(1.7); $("zoom-out").onclick = () => zoomBy(1 / 1.7);
$("fit").onclick = () => { zoom = 1; centre = null; drawAxis(jelly.state); };

let drag = null;
$("plot").addEventListener("pointerdown", (e) => { if (e.target.id === "toast") return; drag = { x: e.clientX, c: geo?.mid, moved: false, mark: e.target.closest?.("[data-mark]")?.dataset.mark }; });
addEventListener("pointermove", (e) => {
  if (!drag || !geo) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 5) return;
  drag.moved = true; $("plot").classList.add("drag");
  centre = geo.sc.fromU(drag.c - dx / geo.px); drawAxis(jelly.state);
});
addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null; $("plot").classList.remove("drag");
  if (!d.moved && d.mark) show(d.mark);
});
addEventListener("pointercancel", () => { drag = null; $("plot").classList.remove("drag"); });
$("plot").addEventListener("wheel", (e) => {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - $("plot").getBoundingClientRect().left); }
  else if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && geo && zoom > 1) { e.preventDefault(); centre = geo.sc.fromU(geo.mid + e.deltaX / geo.px); drawAxis(jelly.state); }
}, { passive: false });
$("plot").addEventListener("dblclick", (e) => zoomBy(1.7, e.clientX - $("plot").getBoundingClientRect().left));
new ResizeObserver(() => jelly.state && drawAxis(jelly.state)).observe($("plot"));

const step = (d) => { const ms = marksOf(jelly.state), i = ms.findIndex((m) => m.id === selMark); if (ms.length) show(ms[(Math.max(i, 0) + d + ms.length) % ms.length].id, true); };
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-mark]");
  if (!b || b.closest("svg")) return;   // marks on the axis are handled by the pointer code
  const s = jelly.state, d = b.dataset;
  if (b.id === "toast") { toast = null; return show(d.mark, true); }
  if (d.step) return step(+d.step);
  if (d.mark) return show(d.mark, true);
  if (d.hyp) { selHyp = selHyp === d.hyp && b.classList.contains("hd") ? null : d.hyp; noting = null; render(s); return b.classList.contains("hd") || $(`h-${d.hyp}`)?.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  if ("pin" in d) return jelly.call((s.marks.find((m) => m.id === selMark) || {}).pinned ? "unpin" : "pin", { mark: selMark }).catch(fail);
  if ("unpin" in d) return jelly.call("unpin", { mark: selMark }).catch(fail);
  const hyp = b.closest("[data-hyp-card]")?.dataset.hypCard;
  if (d.verdict) return jelly.call("judge", { hypothesis: hyp, verdict: d.verdict, note: (s.hypotheses.find((h) => h.id === hyp)?.verdict || {}).note || "" }).catch(fail);
  if ("takeback" in d) { noting = null; return jelly.call("take_back", { hypothesis: hyp }).catch(fail); }
  if ("note" in d) { noting = noting === hyp ? null : hyp; render(s); return $(`h-${hyp}-note`)?.focus(); }
  if ("savenote" in d) { const h = s.hypotheses.find((h) => h.id === hyp); return jelly.call("judge", { hypothesis: hyp, verdict: h.verdict.kind, note: $(`h-${hyp}-note`).value }).then(() => { noting = null; render(jelly.state); }, fail); }
  if ("know" in d) { const m = s.marks.find((m) => m.id === selMark) || s.marks[0]; knowing = { kind: "info", lane: m.lane, rel: "after", mark: m.id }; return render(s); }
  if ("knowCancel" in d) { knowing = null; return render(s); }
  if (d.k) { knowing[d.k] = d.v; return render(s); }
  if ("addknow" in d) return jelly.call("know", { ...knowing, mark: $("know-mark").value, text: $("know-text").value }).then(() => { knowing = null; $("know-text").value = ""; render(jelly.state); }, fail);
});
document.addEventListener("change", (e) => { if (e.target.id === "know-mark" && knowing) knowing.mark = e.target.value; });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("textarea, input, select")) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.matches("textarea")) { e.preventDefault(); e.target.closest(".compose")?.querySelector(".send")?.click(); }
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".mark")) { e.preventDefault(); return show(e.target.dataset.mark); }
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "+" || e.key === "=") zoomBy(1.7);
  if (e.key === "-") zoomBy(1 / 1.7);
  if (e.key === "0") $("fit").click();
});

// The project's DESIGN.md tokens, when this is served by the daemon.
if (location.protocol.startsWith("http") && jelly.name.includes(":")) {
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = `/p/${encodeURIComponent(jelly.name.split(":")[0])}/design.css`;
  l.onerror = () => l.remove();
  document.head.appendChild(l);
}
jelly.onState(render);
jelly.onAttention?.(() => render(jelly.state));
</script>
</body>
</html>
