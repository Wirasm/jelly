  await checkLinkEncoding('StyleSheet', 'api-collision', legacyUrl);
  const originalBytes = new Uint8Array(await (await fetch('assets/link-selected.css')).arrayBuffer());
  const collisionBytes = new Uint8Array(await (await fetch('assets/link-collision.css')).arrayBuffer());
  const changedHash = new URL(legacyUrl);
  changedHash.hash = 'changed';
  for (const url of [legacyUrl, legacyUrl + '#fresh', changedHash.href]) {
    await checkLinkEncoding('StyleSheet', 'api-fragment', url);
    for (const input of [url, new URL(url), new Request(url)]) {
      const bytes = new Uint8Array(await (await fetch(input)).arrayBuffer());
      assert(bytes.toString() === originalBytes.toString(), 'API CSS fetch preserves exact source bytes');
    }
  }
  const fetchedCollision = new Uint8Array(await (await fetch(collisionUrl)).arrayBuffer());
  assert(fetchedCollision.toString() === collisionBytes.toString(), 'identical decoded CSS keeps separate source bytes');
  if (document.readyState === 'loading') await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve, {once: true}));
  document.querySelectorAll('.discard-root').forEach(host => host.remove());
  // Detached render trees must be released before testing JavaScript ownership.
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  function discardImperativeRoots() {
    for (const mode of ['open', 'closed']) for (const connected of [true, false]) for (let i = 0; i < 25; i++) {
      const host = document.createElement('div');
      if (connected) document.body.append(host);
      const root = host.attachShadow({mode});
      root.innerHTML = '<span>discarded</span>';
      discardedRoots.push({kind: `imperative-${mode}-${connected}`, ref: new WeakRef(root)});
      host.remove();
    }
  }
  discardImperativeRoots();
  assert(discardedRoots.length === 150, 'all six discarded-root groups populated');
  // WeakRef targets survive their creating job; collect in later browser tasks.
  for (let i = 0; i < 3; i++) {
    await new Promise(resolve => setTimeout(resolve, 0));
    gc();
  }
  const retained = discardedRoots.filter(({ref}) => ref.deref()).map(({kind}) => kind);
  assert(!encodingFailures.length && !retained.length, JSON.stringify({encodingFailures: encodingFailures.length, examples: encodingFailures.slice(0, 8), retained: Object.fromEntries([...new Set(retained)].map(kind => [kind, retained.filter(value => value === kind).length]))}));
  for (const root of liveRoots) {
    root.innerHTML = '<img src="assets/unused.png">';
    await loaded(root.querySelector('img'));
  }
  step = 'attention readers';
  const matrix = [];
  for (const kind of ['ask', 'look']) for (const answer of [undefined, {text: 'yes'}]) for (const withdrawn of [undefined, {by: 'agent'}]) for (const selector of [undefined, '#pictures', '#other']) {
    matrix.push({id: `item-${matrix.length}`, kind, title: 'test', answer, withdrawn, anchor: selector ? {selector} : undefined});
  }
  const readers = [];
  for (const source of [__LIVE_RUNTIME__, __SNAPSHOT_RUNTIME__]) {
    const frame = document.createElement('iframe');
    const ready = new Promise(resolve => { frame.onload = resolve; });
    frame.srcdoc = '<!doctype html><html><head></head><body></body></html>';
    document.body.append(frame);
    await ready;
    const w = frame.contentWindow;
    w.__JELLY__ = {name: 'test:conformance', state: {}, attention: matrix, assets: [], version: 1};
    w.WebSocket = class {};
    w.fetch = async () => ({ok: true, json: async () => w.__JELLY__});
    w.eval(source);
    readers.push({items: ids(w.jelly.items), attention: ids(w.jelly.attention), at: ['#pictures', '#other', '#missing'].map(selector => ids(w.jelly.itemsAt(selector)))});
    frame.remove();
  }
  assert(JSON.stringify(readers[0]) === JSON.stringify(readers[1]), 'live and shared attention conformance');
  const calls = [];
  const nativeFetch = window.fetch;
  window.fetch = (...args) => { calls.push(args); return nativeFetch(...args); };
  for (const mutate of [() => jelly.answer('a1', 'x'), () => jelly.call('change'), () => jelly.comment({}, 'no'), () => jelly.reply('x', 'no'), () => jelly.resolve('x')]) {
    let rejected = false;
    try { await mutate(); } catch (e) { rejected = e.message.includes('read-only'); }

  }
  assert(document.body.textContent.includes('Read-only snapshot.'), 'visible refusal');
  assert(JSON.stringify(jelly.state) === original && JSON.stringify(jelly.items) === history, 'mutations leave captured data unchanged');
  assert(calls.length === 0, 'mutations do not request API');
  assert(!performance.getEntriesByType('resource').some(e => /\/api\//.test(e.name)), 'no daemon requests');
  assert(errors.length === 0, errors.join('; '));

})().catch(e => finish({complete: true, ok: false, error: String(e), errors}));
